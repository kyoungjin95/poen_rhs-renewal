<html>
	<head>
		<title>BSA 대기 수량 현황</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="base/style/item-detail.css">
	</head>
	<body>
		<div>
			<h1 style="text-align: center;">BSA 대기 수량 현황</h1>
			<center>
				<div>
					<div style="margin: 10px 10px 10px 10px">
						<div>
							<div style="display:flex; flex-wrap: wrap; justify-content: space-between;">
								<div style="background-color: gold; width: 10%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
									<h3 style="color:#fff;">입고<br/>대기</h3>
									<span id="check_num1" style="font-size:3vw; color:#fff;"></span>
								</div>
								<div style="background-color: blue; width: 10%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
									<h3 style="color:#fff;">세척<br/>대기</h3>
									<span id="check_num2" style="font-size:3vw; color:#fff;"></span>
								</div>
								<div style="background-color: red; width: 10%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
									<h3 style="color:#fff;">기초<br/>검사</h3>
									<span id="check_num3" style="font-size:3vw; color:#fff;"></span>
								</div>
								<div style="background-color: green; width: 10%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
									<h3 style="color:#fff;">분해<br/>조립</h3>
									<span id="check_num4" style="font-size:3vw; color:#fff;"></span>
								</div>
								<div style="background-color: orange; width: 10%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
									<h3 style="color:#fff;">성능<br/>검사</h3>
									<span id="check_num5" style="font-size:3vw; color:#fff;"></span>
								</div>
								<div style="background-color: purple; width: 10%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
									<h3 style="color:#fff;">EOL<br/>대기</h3>
									<span id="check_num6" style="font-size:3vw; color:#fff;"></span>
								</div>
								<div style="background-color: brown; width: 10%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
									<h3 style="color:#fff;">출하<br/>대기</h3>
									<span id="check_num7" style="font-size:3vw; color:#fff;"></span>
								</div>
							</div>
						</div>
					</div>
					<div>
						<select id="filter-field">
							<option></option>
							<option value="출하예약">출하예약</option>
							<option value="관리번호">관리번호</option>
							<option value="재제조번호">재제조번호</option>
							<option value="차종">차종</option>
							<option value="구분">구분</option>
							<option value="품번">품번</option>
							<option value="RO_no">RO_no</option>
							<option value="공정단계">공정단계</option>
							<option value="적재No">적재No</option>
							<option value="입고">입고</option>
							<option value="제조투입">제조투입</option>
							<option value="세척투입일">세척투입일</option>
							<option value="세척">세척</option>
							<option value="기초검사투입">기초검사투입</option>
							<option value="기초검사">기초검사</option>
							<option value="분해조립투입">분해조립투입</option>
							<option value="분해조립">분해조립</option>
							<option value="성능검사투입">성능검사투입</option>
							<option value="성능검사">성능검사</option>
							<option value="EOL투입일">EOL투입일</option>
							<option value="EOL">EOL</option>
							<option value="출하">출하</option>
							<option value="소재지">소재지</option>
							<option value="반품입고">반품입고</option>
							<option value="재출하">재출하</option>
							<option value="완전분해">완전분해</option>
							<option value="폐기">폐기</option>
						</select>

						<select id="filter-type">
							<option value="=">=</option>
							<option value="<"><</option>
							<option value="<="><=</option>
							<option value=">">></option>
							<option value=">=">>=</option>
							<option value="!=">!=</option>
							<option value="like">like</option>
						</select>

						<input id="filter-value" type="text" placeholder="value to filter">

						<button id="filter-clear">Clear Filter</button>
					</div>
					<div>
						<label for='grid_출하대기'>출하대기 BSA</label>
						<div id='grid_출하대기'></div>
					</div>
					<div>
						<label id='출하예약_관리번호'>출하 예약 관리번호:</label>
					</div>
					<div>
						<button onClick='출하예약();'>출하 예약</button>
						<button onClick='출하예약취소();'>예약 취소</button>
					</div>
				</div>
			</center>
		</div>
	</body>
</html>
