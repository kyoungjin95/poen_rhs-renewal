								type="date"
								id="_검색일_to"
								size="40"
								value="0000-00-00"

								required
								/>

				</div>

							</div>
							<div class="dash__item d2" id='기초'>

								</div>
								<h3>기초검사</h3>
								<span id="num3"></span>
							</div>
							<div class="dash__item d3" id='분해'>
								<div class="dash-icon">
									<img src="base/img/operation.png" alt="분해조립" />
								</div>
								<h3>분해조립</h3>
								<span id="num4"></span>
							</div>
							<div class="dash__item d3" id='성능'>
								<div class="dash-icon">
									<img src="base/img/battery-status.png" alt="성능검사" />
								</div>
								<h3>성능검사</h3>
								<span id="num5"></span>
							</div>
							<div class="dash__item d1" id='EOL'>
								<div class="dash-icon">
									<img src="base/img/eol.png" alt="EOL" />
								</div>
								<h3>EOL</h3>
								<span id="num6"></span>
							</div>
							<div class="dash__item d2" id='출하검사'>
								<div class="dash-icon">
									<img src="base/img/quality-control.png" alt="출하검사" />
								</div>
								<h3>출하검사</h3>
								<span id="num7"></span>
							</div>
							<div class="dash__item d3" id='출하'>
								<div class="dash-icon">
									<img src="base/img/delivery.png" alt="출하" />
								</div>
								<h3>출하</h3>
								<span id="num8"></span>
							</div>
							<!--<div style="background-color: navy; width: 23%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
								<h3 style="color:#fff;">마도</h3>
								<span id="num6" style="font-size:3vw; color:#fff;"></span>
								</div>
								<div style="background-color: gray; width: 23%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
								<h3 style="color:#fff;">구장</h3>
								<span id="num7" style="font-size:3vw; color:#fff;"></span>
								</div>-->
								<!--<div style="background-color: black; width: 23%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
									<h3 style="color:#fff;">폐기</h3>
									<span id="num9" style="font-size:3vw; color:#fff;"></span>
									</div>-->
						</div>
					</div>
				</div>
			</div>

			<div class="bsa-process">
				<label id="공정라벨" for="grid_공정">선택 공정 BSA</label>
				<div id="grid_공정" class="bsa-title"></div>
			</div>
