<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>Dashboard</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="base/style/newstyle.css" />
  </head>

  <body>
    <section class="page page-dashboard">
      <header class="page-header">
        <h2 class="page-title">재제조 현황</h2>
      </header>

      <!-- 조회 -->
      <div class="card">
        <h2 class="card-title">조회 기간</h2>
        <div class="data-check">
          <input type="date" id="_검색일_from" value="0000-00-00" max="240-12-4" required />
          <span class="tilde">~</span>
          <input type="date" id="_검색일_to" value="0000-00-00" max="240-12-4" required />
          <button onClick="dashboard_조회();" class="btn-primary">조회</button>
        </div>
      </div>

      <!-- 공정별 카운트 -->
      <div class="card">
        <h2 class="card-title">공정별 현황</h2>
        <div class="stat-grid">
          <div class="stat-card" id="입고">
            <div class="stat-icon"><img src="base/img/cargo.png" alt="입고" /></div>
            <h3 class="stat-label">입고</h3>
            <div class="stat-value">
              <span id="num1"></span>
              <span class="stat-sub" id="num1t"></span>
            </div>
          </div>
          <div class="stat-card" id="세척">
            <div class="stat-icon"><img src="base/img/clean.png" alt="세척" /></div>
            <h3 class="stat-label">세척</h3>
            <div class="stat-value">
              <span id="num2"></span>
              <span class="stat-sub" id="num2t"></span>
            </div>
          </div>
          <div class="stat-card" id="기초">
            <div class="stat-icon"><img src="base/img/quality-control.png" alt="기초검사" /></div>
            <h3 class="stat-label">기초검사</h3>
            <div class="stat-value">
              <span id="num3"></span>
              <span class="stat-sub" id="num3t"></span>
            </div>
          </div>
          <div class="stat-card" id="분해">
            <div class="stat-icon"><img src="base/img/operation.png" alt="분해조립" /></div>
            <h3 class="stat-label">분해조립</h3>
            <div class="stat-value">
              <span id="num4"></span>
              <span class="stat-sub" id="num4t"></span>
            </div>
          </div>
          <div class="stat-card" id="성능">
            <div class="stat-icon"><img src="base/img/battery-status.png" alt="성능검사" /></div>
            <h3 class="stat-label">성능검사</h3>
            <div class="stat-value">
              <span id="num5"></span>
              <span class="stat-sub" id="num5t"></span>
            </div>
          </div>
          <div class="stat-card" id="EOL">
            <div class="stat-icon"><img src="base/img/eol.png" alt="EOL" /></div>
            <h3 class="stat-label">EOL</h3>
            <div class="stat-value">
              <span id="num6"></span>
              <span class="stat-sub" id="num6t"></span>
            </div>
          </div>
          <div class="stat-card" id="출하검사">
            <div class="stat-icon"><img src="base/img/oqc.png" alt="출하검사" /></div>
            <h3 class="stat-label">출하검사</h3>
            <div class="stat-value">
              <span id="num7"></span>
              <span class="stat-sub" id="num7t"></span>
            </div>
          </div>
          <div class="stat-card" id="출하">
            <div class="stat-icon"><img src="base/img/outgoing.png" alt="출하" /></div>
            <h3 class="stat-label">출하</h3>
            <div class="stat-value">
              <span id="num8"></span>
              <span class="stat-sub" id="num8t"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- 공정 상세 표 -->
      <div class="card">
        <h2 class="card-title"><label id="공정라벨" for="grid_공정">공정 상세</label></h2>
        <div id="grid_공정" class="bsa-title"></div>
      </div>
    </section>
  </body>
</html>
