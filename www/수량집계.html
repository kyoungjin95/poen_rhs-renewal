<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>품번별 수량 현황</title>
  </head>

  <body>
    <section class="page page-수량집계">
      <header class="page-header">
        <h2 class="page-title">품번별 수량 현황</h2>
      </header>

      <!-- 조회 옵션 -->
      <div class="card">
        <h2 class="card-title">조회 조건</h2>
        <div class="data">
          <div class="data__query">
            <div class="data-period-btns">
              <button onClick="수량집계_year();" class="btn-secondary">Year</button>
              <button onClick="수량집계_month();" class="btn-secondary">Month</button>
            </div>
            <div class="data-check">
              <input type="date" id="_검색일_from" value="0000-00-00" max="240-12-4" required />
              <span class="tilde">~</span>
              <input type="date" id="_검색일_to" value="0000-00-00" max="240-12-4" required />
              <button onClick="수량집계_기간조회();" class="btn-primary">조회</button>
            </div>
            <div class="data__radio">
              <input type="radio" id="_all" name="구분" value="all" checked />
              <label for="_all"><span>All</span></label>
              <input type="radio" id="_일반" name="구분" value="일반" />
              <label for="_일반"><span>일반</span></label>
              <input type="radio" id="_보증" name="구분" value="보증" />
              <label for="_보증"><span>보증</span></label>
            </div>
          </div>
        </div>
      </div>

      <!-- 품번별 배터리팩 집계 -->
      <div class="card">
        <div class="card-header-row">
          <h2 class="card-title">품번별 배터리팩 집계</h2>
          <button onClick="수량집계_export_to_excel();" class="btn-primary">Excel 내보내기</button>
        </div>
        <div id="grid_BSA집계"></div>
      </div>

      <!-- 품번별 폐기 배터리모듈 집계 -->
      <div class="card">
        <h2 class="card-title">품번별 폐기 배터리모듈 집계</h2>
        <div id="grid_BMA집계"></div>
      </div>

      <!-- 품번별 고품 자재 집계 -->
      <div class="card">
        <h2 class="card-title">품번별 고품 자재 집계</h2>
        <div id="grid_자재집계"></div>
      </div>

      <!-- 부재료 집계 -->
      <div class="card">
        <div class="card-header-row">
          <h2 class="card-title">부재료 집계</h2>
          <button onClick="부품집계_export_to_excel();" class="btn-primary">Excel 내보내기</button>
        </div>
        <div class="gather-filter">
          <select id="new_filter-field">
            <option></option>
            <option value="품번">품번</option>
            <option value="품명">품명</option>
            <option value="차종">차종</option>
            <option value="입고수">입고수</option>
            <option value="출고수">출고수</option>
            <option value="합계">합계</option>
          </select>
          <select id="new_filter-type">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value="<="><=</option>
            <option value=">">></option>
            <option value=">=">>=</option>
            <option value="!=">!=</option>
            <option value="like">like</option>
          </select>
          <input id="new_filter-value" type="text" placeholder="검색어" />
          <button id="new_filter-clear">필터 초기화</button>
        </div>
        <div id="grid_부품집계"></div>
      </div>
    </section>
  </body>
</html>
