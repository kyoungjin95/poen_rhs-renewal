<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배터리팩정보입력 - 성능검사</title>
  </head>

  <body>
    <section class="page page-성능검사">
      <header class="page-header">
        <h2 class="page-title">성능검사</h2>
      </header>

      <!-- 검색 & 리스트 -->
      <div class="card">
        <h2 class="card-title">목록 조회</h2>
        <div class="gather-filter">
          <select id="filter-field">
            <option></option>
            <option value="관리번호">관리번호</option>
            <option value="재제조번호">재제조번호</option>
            <option value="구분">구분</option>
            <option value="차종">차종</option>
            <option value="품번">품번</option>
            <option value="RO_no">RO_no</option>
            <option value="공정단계">공정단계</option>
            <option value="적재No">적재No</option>
            <option value="입고">입고</option>
            <option value="제조투입">제조투입</option>
            <option value="세척투입일">세척투입일</option>
            <option value="세척">세척</option>
            <option value="기초검사투입">기초검사투입</option>
            <option value="기초검사">기초검사</option>
            <option value="분해조립투입">분해조립투입</option>
            <option value="분해조립">분해조립</option>
            <option value="성능검사투입">성능검사투입</option>
            <option value="성능검사">성능검사</option>
            <option value="EOL투입일">EOL투입일</option>
            <option value="EOL">EOL</option>
            <option value="출하검사">출하검사</option>
            <option value="납품처">납품처</option>
            <option value="출하">출하</option>
            <option value="소재지">소재지</option>
            <option value="반품입고">반품입고</option>
            <option value="재출하">재출하</option>
            <option value="완전분해">완전분해</option>
            <option value="폐기">폐기</option>
            <option value="마지막충전일">마지막충전일</option>
          </select>
          <select id="filter-type">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value="<="><=</option>
            <option value=">">></option>
            <option value=">=">>=</option>
            <option value="!=">!=</option>
            <option value="like">like</option>
          </select>
          <input id="filter-value" type="text" placeholder="검색어" />
          <button id="filter-clear">필터 초기화</button>
          <button onClick="성능검사_list();" class="btn-primary">LIST</button>
        </div>
        <div id="grid_list"></div>
      </div>

      <!-- 성능 차트 -->
      <div class="card">
        <h2 class="card-title">성능 차트</h2>
        <div style="overflow-x: auto">
          <canvas id="_chart" width="800" height="300"></canvas>
        </div>
      </div>

      <!-- 기본 정보 -->
      <div class="card">
        <h2 class="card-title">기본 정보</h2>
        <div class="form-grid">
          <div class="field">
            <label for="_management_id">관리번호</label>
            <div class="field-input">
              <input type="text" id="_management_id" value="" required />
              <button onClick="성능검사_시작(0);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_재제조번호">재제조번호</label>
            <div class="field-input">
              <input type="text" id="_재제조번호" required />
              <button onClick="성능검사_시작(1);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_RO_no">RO no.</label>
            <div class="field-input">
              <input type="text" id="_RO_no" required />
              <button onClick="성능검사_시작(2);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_구분">구분</label>
            <input type="text" id="_구분" readonly required />
          </div>
          <div class="field">
            <label for="_차종">차종</label>
            <input type="text" id="_차종" readonly required />
          </div>
          <div class="field">
            <label for="_품번">품번</label>
            <input type="text" id="_품번" readonly required />
          </div>
          <div class="field">
            <label for="_VIN">VIN</label>
            <input type="text" id="_VIN" required />
          </div>
          <div class="field">
            <label for="_">Serial No.</label>
            <input type="text" id="_sn" required />
          </div>
          <div class="field">
            <label for="_공정입고일">공정 입고일</label>
            <input type="datetime-local" id="_공정입고일" value="0000-00-00T00:00" required />
          </div>
        </div>
      </div>

      <!-- 성능 측정 (form 안에 — 파일 업로드 동작 유지) -->
      <form id="_form" action="/upload_excel" method="post" enctype="multipart/form-data">
        <div class="card">
          <h2 class="card-title">성능 측정</h2>

          <div id="_용량평가_files" class="inspection-section">
            <div class="form-grid">
              <div class="field full">
                <label for="_용량평가">용량평가 (Ah, KWh)</label>
                <input type="text" id="_용량평가" required />
              </div>
            </div>
            <div class="file-grid">
              <div class="file-slot">
                <span class="file-slot-label">충방전기 DATA</span>
                <div id="_file_exist1" class="process__file t1-d">
                  <div id="_inFile1" class="in-file" style="display: none">
                    <button class="download-file" onClick="download1();" type="button">
                      <i class="fas fa-arrow-down"></i>
                    </button>
                  </div>
                  <div class="files">
                    <input type="file" class="file_upload" id="_file1" name="excel" />
                    <label for="_file1" class="upload_label"> <i class="fa-regular fa-file"></i>&nbsp;파일 선택 </label>
                    <span class="delete_icon" style="display: none">❌</span>
                  </div>
                </div>
              </div>
              <div class="file-slot">
                <span class="file-slot-label">MES DATA</span>
                <div id="_file_exist2" class="process__file t1-d">
                  <div id="_inFile2" class="in-file" style="display: none">
                    <button class="download-file" onClick="download2();" type="button">
                      <i class="fas fa-arrow-down"></i>
                    </button>
                  </div>
                  <div class="files">
                    <input type="file" class="file_upload" id="_file2" name="excel" />
                    <label for="_file2" class="upload_label"> <i class="fa-regular fa-file"></i>&nbsp;파일 선택 </label>
                    <span class="delete_icon" style="display: none">❌</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="_SOC_files" class="inspection-section">
            <div class="form-grid">
              <div class="field full">
                <label for="_SOC60Percent" id="_SOC60Percent_label">SOC60Percent (V)</label>
                <input type="text" id="_SOC60Percent" required />
              </div>
            </div>
            <div class="file-grid">
              <div class="file-slot">
                <span class="file-slot-label">충방전기 DATA</span>
                <div id="_file_exist3" class="process__file t1-d">
                  <div id="_inFile3" class="in-file" style="display: none">
                    <button class="download-file" onClick="download3();" type="button">
                      <i class="fas fa-arrow-down"></i>
                    </button>
                  </div>
                  <div class="files">
                    <input type="file" class="file_upload" id="_file3" name="excel" />
                    <label for="_file3" class="upload_label"> <i class="fa-regular fa-file"></i>&nbsp;파일 선택 </label>
                    <span class="delete_icon" style="display: none">❌</span>
                  </div>
                </div>
              </div>
              <div class="file-slot">
                <span class="file-slot-label">MES DATA</span>
                <div id="_file_exist4" class="process__file t1-d">
                  <div id="_inFile4" class="in-file" style="display: none">
                    <button class="download-file" onClick="download4();" type="button">
                      <i class="fas fa-arrow-down"></i>
                    </button>
                  </div>
                  <div class="files">
                    <input type="file" class="file_upload" id="_file4" name="excel" />
                    <label for="_file4" class="upload_label"> <i class="fa-regular fa-file"></i>&nbsp;파일 선택 </label>
                    <span class="delete_icon" style="display: none">❌</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div id="_DCIR_files" class="inspection-section">
            <div class="form-grid">
              <div class="field full">
                <label for="_DCIR">DCIR 종합 (mΩ)</label>
                <input type="text" id="_DCIR" required />
              </div>
            </div>
            <div class="file-grid">
              <div class="file-slot">
                <span class="file-slot-label" id="_DCIR_file_label1">충방전기 DATA</span>
                <div id="_file_exist5" class="process__file t1-d">
                  <div id="_inFile5" class="in-file" style="display: none">
                    <button class="download-file" onClick="download5();" type="button">
                      <i class="fas fa-arrow-down"></i>
                    </button>
                  </div>
                  <div class="files">
                    <input type="file" class="file_upload" id="_file5" name="excel" />
                    <label for="_file5" class="upload_label"> <i class="fa-regular fa-file"></i>&nbsp;파일 선택 </label>
                    <span class="delete_icon" style="display: none">❌</span>
                  </div>
                </div>
              </div>
              <div class="file-slot">
                <span class="file-slot-label" id="_DCIR_file_label2">MES DATA</span>
                <div id="_file_exist6" class="process__file t1-d">
                  <div id="_inFile6" class="in-file" style="display: none">
                    <button class="download-file" onClick="download6();" type="button">
                      <i class="fas fa-arrow-down"></i>
                    </button>
                  </div>
                  <div class="files">
                    <input type="file" class="file_upload" id="_file6" name="excel" />
                    <label for="_file6" class="upload_label"> <i class="fa-regular fa-file"></i>&nbsp;파일 선택 </label>
                    <span class="delete_icon" style="display: none">❌</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- DCIR 세부 -->
        <div class="card">
          <h2 class="card-title">DCIR 세부 측정</h2>
          <div class="form-grid">
            <div class="field">
              <label for="_DCIR_Charge1">DCIR (0.5C) 방전</label>
              <input type="text" id="_DCIR_Charge1" required />
            </div>
            <div class="field">
              <label for="_DCIR_Charge2">DCIR (0.5C) 충전</label>
              <input type="text" id="_DCIR_Charge2" required />
            </div>
            <div class="field">
              <label for="_DCIR_Charge3">DCIR (0.7C) 방전</label>
              <input type="text" id="_DCIR_Charge3" required />
            </div>
            <div class="field">
              <label for="_DCIR_Charge4">DCIR (0.7C) 충전</label>
              <input type="text" id="_DCIR_Charge4" required />
            </div>
            <div class="field">
              <label for="_DCIR_Charge5">DCIR (1.0C) 방전</label>
              <input type="text" id="_DCIR_Charge5" required />
            </div>
            <div class="field">
              <label for="_DCIR_Charge6">DCIR (1.0C) 충전</label>
              <input type="text" id="_DCIR_Charge6" required />
            </div>
          </div>
        </div>

        <!-- 진단 정보 -->
        <div class="card">
          <h2 class="card-title">진단 정보</h2>
          <div class="form-grid">
            <div class="field full">
              <label for="_분해조립_재의뢰사유">분해조립 재의뢰 사유</label>
              <input type="text" id="_분해조립_재의뢰사유" required />
            </div>
            <div class="field">
              <label for="_공정완료일">공정 완료일</label>
              <input type="datetime-local" id="_공정완료일" value="0000-00-00T00:00" required />
            </div>
            <div class="field">
              <label for="_검사자">검사자</label>
              <input type="text" id="_검사자" required />
            </div>
          </div>
        </div>
      </form>

      <!-- 파일 업로드 상태 -->
      <div class="card" style="text-align: center">
        <label id="_process" style="font-size: 13px; color: var(--text-secondary)">파일 업로드 STATUS</label>
      </div>

      <!-- 액션 -->
      <div class="form-actions">
        <button onClick="이전페이지();" class="btn-secondary">이전 페이지</button>
        <button onClick="성능검사_분해조립재의뢰();" class="btn-secondary">분해조립 재의뢰</button>
        <button id="_btn_upload" onClick="file_upload();" class="btn-secondary">파일 업로드</button>
        <button onClick="성능검사_save();" class="btn-primary">저장</button>
      </div>
    </section>

    <script>
      const _bnt_upload = document.getElementById('_btn_upload');
      const _form = document.getElementById('_form');
      const _management_id = document.getElementById('_management_id');
      const _재제조번호 = document.getElementById('_재제조번호');
      const _RO_no = document.getElementById('_RO_no');
      const _구분 = document.getElementById('_구분');
      const _차종 = document.getElementById('_차종');
      const _품번 = document.getElementById('_품번');
      const _VIN = document.getElementById('_VIN');
      const _sn = document.getElementById('_sn');

      const _용량평가 = document.getElementById('_용량평가');
      const _SOC40Percent = document.getElementById('_SOC40Percent');
      const _DCIR = document.getElementById('_DCIR');
      const _DCIR_Charge1 = document.getElementById('_DCIR_Charge1');
      const _DCIR_Charge2 = document.getElementById('_DCIR_Charge2');
      const _DCIR_Charge3 = document.getElementById('_DCIR_Charge3');
      const _DCIR_Charge4 = document.getElementById('_DCIR_Charge4');
      const _DCIR_Charge5 = document.getElementById('_DCIR_Charge5');
      const _DCIR_Charge6 = document.getElementById('_DCIR_Charge6');
      const _분해조립_재의뢰사유 = document.getElementById('_분해조립_재의뢰사유');
      const _완료일 = document.getElementById('_완료일');
      const _검사자 = document.getElementById('_검사자');

      const _file1 = document.getElementById('_file1');
      const _file2 = document.getElementById('_file2');
      const _file3 = document.getElementById('_file3');
      const _file4 = document.getElementById('_file4');
      const _file5 = document.getElementById('_file5');
      const _file6 = document.getElementById('_file6');

      const _inFile1 = document.getElementById('_inFile1');
      const _inFile2 = document.getElementById('_inFile2');
      const _inFile3 = document.getElementById('_inFile3');
      const _inFile4 = document.getElementById('_inFile4');
      const _inFile5 = document.getElementById('_inFile5');
      const _inFile6 = document.getElementById('_inFile6');

      const _download1 = document.getElementById('_download1');
      const _download2 = document.getElementById('_download2');
      const _download3 = document.getElementById('_download3');
      const _download4 = document.getElementById('_download4');
      const _download5 = document.getElementById('_download5');
      const _download6 = document.getElementById('_download6');

      const _file_exist1 = document.getElementById('_file_exist1');
      const _file_exist2 = document.getElementById('_file_exist2');
      const _file_exist3 = document.getElementById('_file_exist3');
      const _file_exist4 = document.getElementById('_file_exist4');
      const _file_exist5 = document.getElementById('_file_exist5');
      const _file_exist6 = document.getElementById('_file_exist6');
    </script>
  </body>
</html>
