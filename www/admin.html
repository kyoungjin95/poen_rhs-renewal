<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>계정 관리</title>
  </head>

  <body>
    <section class="page page-admin">
      <header class="page-header">
        <h2 class="page-title">계정 관리</h2>
      </header>

      <!-- 계정 추가/수정 -->
      <div class="card">
        <h2 class="card-title">계정 정보</h2>

        <div class="form-grid">
          <div class="field">
            <label for="_id">ID</label>
            <input type="text" id="_id" required />
          </div>
          <div class="field">
            <label for="_이름">이름</label>
            <input type="text" id="_이름" required />
          </div>
          <div class="field">
            <label for="_passwd">Password</label>
            <input type="password" id="_passwd" required />
          </div>
          <div class="field">
            <label for="_passwd2">Password 확인</label>
            <input type="password" id="_passwd2" required />
          </div>
          <div class="field">
            <label for="_level">Level</label>
            <input type="text" id="_level" placeholder="관리자 / 작업자" required />
          </div>
        </div>
      </div>

      <!-- 권한 설정 -->
      <div class="card">
        <h2 class="card-title">권한 설정</h2>
        <p style="font-size: 12px; color: var(--text-muted); margin: 0 0 16px">권한이 있으면 'o', 없으면 빈 칸</p>

        <div class="form-grid">
          <div class="field">
            <label for="_기본정보">기본정보</label>
            <input type="text" id="_기본정보" required />
          </div>
          <div class="field">
            <label for="_관리번호">관리번호</label>
            <input type="text" id="_관리번호" required />
          </div>
          <div class="field">
            <label for="_입고">입고</label>
            <input type="text" id="_입고" required />
          </div>
          <div class="field">
            <label for="_세척">세척</label>
            <input type="text" id="_세척" required />
          </div>
          <div class="field">
            <label for="_기초검사">기초검사</label>
            <input type="text" id="_기초검사" required />
          </div>
          <div class="field">
            <label for="_분해조립">분해조립</label>
            <input type="text" id="_분해조립" required />
          </div>
          <div class="field">
            <label for="_성능검사">성능검사</label>
            <input type="text" id="_성능검사" required />
          </div>
          <div class="field">
            <label for="_EOL">EOL</label>
            <input type="text" id="_EOL" required />
          </div>
          <div class="field">
            <label for="_출하검사">출하검사</label>
            <input type="text" id="_출하검사" required />
          </div>
          <div class="field">
            <label for="_부품재고">부품재고</label>
            <input type="text" id="_부품재고" required />
          </div>
          <div class="field">
            <label for="_완료일수정">완료일수정</label>
            <input type="text" id="_완료일수정" required />
          </div>
        </div>
      </div>

      <!-- 액션 -->
      <div class="form-actions">
        <button onClick="delete_user();" class="btn-secondary">계정 삭제</button>
        <button onClick="add_user();" class="btn-primary">저장</button>
      </div>

      <!-- 계정 목록 -->
      <div class="card">
        <h2 class="card-title">계정 목록</h2>
        <div id="grid_user_info"></div>
      </div>
    </section>
  </body>
</html>
