<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="base/style/공정.css" />
    <title>입고</title>
  </head>
  <body>
    <div class="입고">
      <div class="process__tit">
        <h2>BSA 등록(입고)</h2>
      </div>
      <div class="input-group process-step">
        <table class="tb">
          <colgroup>
            <col class="col_1" width="30%" />
            <col class="col_2" width="70%" />
          </colgroup>
          <tr>
            <td>
              <label for="management_id">관리번호</label>
            </td>
            <td>
              <input
                type="text"
                id="_management_id"
                value="조회 버튼을 누르세요"
                size="40"
                required
              />
              <button onClick="입고_시작();">조 회</button>
            </td>
          </tr>
          <tr>
            <td>
              <label for="_입고일">입고일</label>
            </td>
            <td>
              <input
                type="datetime-local"
                id="_입고일"
                size="40"
                value="0000-00-00T00:00"
                required
              />
            </td>
          </tr>
          <tr>
            <td>
              <label for="_입고처">입고처</label>
            </td>
            <td>
              <input type="text" id="_입고처" size="40" required />
            </td>
          </tr>
          <tr>
            <td>
              <label for="_구분">구분</label>
            </td>
            <td>
              <input type="text" id="_구분" size="40" required />
              <div id="_입고_기타">
                <select name="language" onchange="_구분_콤보박스(this);">
                  <option value="">---</option>
                  <option value="일반">일반</option>
                  <option value="보증">보증</option>
                  <option value="일반기타">일반기타</option>
                  <option value="보증기타">보증기타</option>
                </select>
              </div>
              <div id="_입고_일반">
                <select name="language" onchange="_구분_콤보박스(this);">
                  <option value="">---</option>
                  <option value="일반">일반</option>
                  <option value="보증">보증</option>
                </select>
              </div>
            </td>
          </tr>
          <tr>
            <td>
              <label for="_차종">차종</label>
            </td>
            <td>
              <input type="text" id="_차종" size="40" required />
            </td>
          </tr>
          <tr>
            <td>
              <label for="_품번">품번</label>
            </td>
            <td>
              <input type="text" id="_품번" size="40" required />
            </td>
          </tr>
        </table>
      </div>
      <div class="input-group">
        <div class="input-btn-group">
          <button onClick="입고_save();">SAVE</button>
          <button onClick="이전페이지();">이전 Page</button>
        </div>
      </div>
      <script>
        const _management_id = document.getElementById("_management_id");
        const _입고일 = document.getElementById("_입고일");
        const _입고처 = document.getElementById("_입고처");
        const _구분 = document.getElementById("_구분");
        const _차종 = document.getElementById("_차종");
        const _품번 = document.getElementById("_품번");
      </script>
    </div>
  </body>
</html>
