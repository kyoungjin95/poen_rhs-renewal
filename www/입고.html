<html>
	<head>
		<title>입고</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="base/style/공정.css">
	</head>
	<body>
		<div class="입고">
			<div>
				<center>
					<label><h2><b>BSA 등록(입고)</b></h2></label>
				</center>
			</div>
			<div>
				<center>
					<table border="2">
						<tr>
							<td>
								<label for="management_id"><b>관리번호</b></label>
							</td>
							<td>
								<input type="text" id="_management_id" value="조회 버튼을 누르세요" size="40" required>
								<button onClick="입고_시작();">조 회</button>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_입고일"><b>입고일</b></label>
							</td>
							<td>
								<input type="datetime-local" id="_입고일" size="40" value="0000-00-00T00:00" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_입고처"><b>입고처</b></label>
							</td>
							<td>
								<input type="text" id="_입고처" size="40" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_구분"><b>구분</b></label>
							</td>
							<td>
								<input type="text" id="_구분" size="40" required>
							</td>
							<td>
								<select name="language" onchange="_구분_콤보박스(this);">
									<option value="">---</option>
									<option value="일반">일반</option>
									<option value="보증">보증</option>
								</select>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_차종"><b>차종</b></label>
							</td>
							<td>
								<input type="text" id="_차종" size="40" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_품번"><b>품번</b></label>
							</td>
							<td>
								<input type="text" id="_품번" size="40" required>
							</td>
						</tr>
					</table>
				</center>
			</div>
			<div class="input-group">
				<center>
					<button onClick="입고_save();">SAVE</button>
					<button onClick="이전페이지();">이전 Page</button>
				</center>
			</div>
			<script>
				const _management_id = document.getElementById('_management_id');
				const _입고일 = document.getElementById('_입고일');
				const _입고처 = document.getElementById('_입고처');
				const _구분 = document.getElementById('_구분');
				const _차종 = document.getElementById('_차종');
				const _품번 = document.getElementById('_품번');
			</script>
	</body>
</html>
