<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>carinfo-login</title>
    <script
      src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.mjs"
      type="module"
    ></script>
  </head>
  <body>
    <div class="container">
      <div class="c__login" id="loginForm">
        <div class="ani">
          <dotlottie-player
            src="https://lottie.host/a1cf453f-cf10-49b0-abb4-be83f4a9ebaa/OJMc2qiAE2.json"
            background="transparent"
            loop
            speed="0.5"
            style="
              width: 180px;
              height: 180px;
              background: linear-gradient(lightCyan, skyBlue, deepSkyBlue);
              border-radius: 50%;
            "
            autoplay
            actions='[{"type":"stop","frames":[244]}]'
          >
            ></dotlottie-player
          >
        </div>
        <ul class="content__box">
          <li>
            <h3>아이디</h3>
            <input type="text" id="id" placeholder="아이디를 입력하세요" />
          </li>
          <li>
            <h3>비밀번호</h3>
            <input
              type="password"
              id="passwd"
              class="password"
              placeholder="비밀번호를 입력하세요"
            />
          </li>
        </ul>
        <button id="loginBtn" class="login__btn" onClick="login();">
          로그인
        </button>
      </div>
    </div>
  </body>
</html>
