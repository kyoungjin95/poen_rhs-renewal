<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>년간 현황</title>
  </head>

  <body>
    <section class="page page-년간현황">
      <header class="page-header">
        <h2 class="page-title">년간 현황</h2>
      </header>

      <!-- 조회 -->
      <div class="card">
        <h2 class="card-title">조회 조건</h2>
        <div class="data-check">
          <select name="year" id="_검색일" onchange="yearOnChange(this)"></select>
          <button onClick="년간_조회(true);" class="btn-primary">조회</button>
        </div>
      </div>

      <!-- 차트 -->
      <div class="card">
        <h2 class="card-title">Chart</h2>
        <div style="overflow-x: auto">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">Chart Detail</h2>
        <div style="overflow-x: auto">
          <canvas id="chart-detail"></canvas>
        </div>
      </div>

      <!-- 입고/출하 표 -->
      <div class="card">
        <h2 class="card-title">입고</h2>
        <div id="grid_입고"></div>
      </div>

      <div class="card">
        <h2 class="card-title">출하</h2>
        <div id="grid_출하"></div>
      </div>
    </section>
    <script>
      const _검색일 = document.getElementById('_검색일');
    </script>
  </body>
</html>
