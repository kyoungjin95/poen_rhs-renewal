<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>주간 현황</title>
  </head>

  <body>
    <section class="page page-주간현황">
      <header class="page-header">
        <h2 class="page-title">주간 현황</h2>
      </header>

      <!-- 조회 -->
      <div class="card">
        <h2 class="card-title">조회 조건</h2>
        <div class="data-check">
          <input type="date" id="_검색일" value="0000-00-00" max="240-12-4" required />
          <button onClick="날짜_조회();" class="btn-primary">조회</button>
        </div>
      </div>

      <!-- 차트 -->
      <div class="card">
        <h2 class="card-title">Chart</h2>
        <div style="overflow-x: auto">
          <canvas id="chart"></canvas>
        </div>
      </div>

      <!-- 표 -->
      <div class="card">
        <h2 class="card-title">입고</h2>
        <div id="grid_입고"></div>
      </div>

      <div class="card">
        <h2 class="card-title">제조완료</h2>
        <div id="grid_제조완료"></div>
      </div>

      <div class="card">
        <h2 class="card-title">출하</h2>
        <div id="grid_출하"></div>
      </div>
    </section>
    <script>
      const _검색일 = document.getElementById('_검색일');
    </script>
  </body>
</html>
