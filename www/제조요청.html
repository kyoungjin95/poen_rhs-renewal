<html>
	<head>
		<title>제조 요청 관리</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="style/item-detail.css">
	</head>
	<body>
		<div class="제조요청">
			<div>
				<center>
					<label><h2><b>제조 요청</b></h2></label>
				</center>
			</div>
			<div class="input-group">
				<div>
					<label for="_요청일"><b></b></label>
				</div>
				<div>
					<input type="text" id="_요청일" size="30" required>
					<button onClick="_요청일();">조 회</button>
				</div>
				<div class="input-group">
					<div>
						<label for="_maker"><b>메이커</b></label>
					</div>
					<div>
						<input type="text" id="_maker" size="30" required>
					</div>
				</div>
				<div class="input-group">
					<div>
						<label for="_수량"><b>수량</b></label>
					</div>
					<div>
						<input type="text" id="_수량" size="30" required>
					</div>
				</div>
				<div class="input-group">
					<div>
						<label for="_완료일"><b>완료일</b></label>
					</div>
					<div>
						<input type="text" id="_완료일" size="30" required>
					</div>
				</div>
				<div class="input-group">
					<center>
						<button onClick="제조요청_save();">SAVE</button>
					</center>
				</div>
			</div>
			<script>
				const _요청일 = document.getElementById('_요청일');
				const _maker = document.getElementById('_maker');
				const _수량 = document.getElementById('_수량');
				const _완료일 = document.getElementById('_완료일');
			</script>
	</body>
</html>
