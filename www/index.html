	</br>
	<div class="buttons">
		<button class="round-btn" id='login_btn' onclick="loadPage('login.html'); change_label();">로그인</button>
		<button class="round-btn" onclick="loadPage('bsa_info.html'    ); flag_재제조현황 = true;">BSA 재제조 DATA</button>
		<button class="round-btn" onclick="loadPage('item-details.html'); flag_상세입력   = true;">품목상세 입력</button>
		<button class="round-btn" onclick="loadPage('year-status.html' ); flag_년간현황   = true;">년간 현황</button>
		<button class="round-btn" onclick="loadPage('month-status.html'); flag_월간현황   = true;">월간 현황</button>
		<button class="round-btn" onclick="loadPage('day-status.html'  ); flag_일간현황   = true;">일간 현황</button>
		<button class="round-btn" onclick="loadPage('type-status.html' ); flag_생산현황   = true;">생산 현황</button>
		<button class="round-btn" onclick="loadPage('dashboard.html'   ); flag_대시보드   = true;">대시 보드</button>
		<button class="round-btn" onclick="loadPage('target.html'      ); flag_목표수량   = true;">목표수량</button>

	</div>
		</div>

		<script src="js/month-status.js"></script>
		<script src="js/year-status.js"></script>
		<script src="js/type-status.js"></script>

		<script src="js/login.js"></script>
		<script src="js/dashboard.js"></script>
		<script>
			loadPage('login.html');
			change_label();
			var flag_재제조현황 = false;
			var flag_상세입력 = false;
			var flag_년간현황 = false;
			var flag_월간현황 = false;
			var flag_일간현황 = false;
			var flag_생산현황 = false;
			var flag_대시보드 = false;
			var flag_목표수량 = false;
			var flag_repeat_생산현황 = false;
			var flag_repeat_대시보드 = false;

			var interval = setInterval(function() {
				if(flag_재제조현황 == true) { stop_repeat(); 재제조현황_시작();}
				if(flag_상세입력 == true) { stop_repeat(); 상세입력_시작(); }
				if(flag_년간현황 == true) { stop_repeat(); 년간현황_시작(); }
				if(flag_월간현황 == true) { stop_repeat(); 월간현황_시작(); }
				if(flag_일간현황 == true) { stop_repeat(); 일간현황_시작(); }
				if(flag_목표수량 == true) { stop_repeat(); 목표수량_시작(); }
				if(flag_생산현황 == true) { start_repeat_생산현황(); 생산현황_시작();}
				if(flag_대시보드 == true) { start_repeat_대시보드(); 대시보드_시작();}
			}, 500);

			var intervalRepeat = setInterval(function() {
				if(flag_repeat_생산현황 == true) 생산현황_시작();
				if(flag_repeat_대시보드 == true) 대시보드_시작();
			}, 1000 * 60);

			function stop_repeat() {
				console.log('stop repeat');
				flag_repeat_생산현황 = false;		
				flag_repeat_대시보드 = false;		
			}

			function start_repeat_생산현황() {
				console.log('start 생산현황 repeat');
				flag_repeat_생산현황 = true;
			}

			function start_repeat_대시보드() {
				console.log('start dashboard repeat');
				flag_repeat_대시보드 = true;
			}
		</script>
	</body>
</html>
