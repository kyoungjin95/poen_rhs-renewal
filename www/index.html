<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<link rel="stylesheet" href="base/style/style.css">
		<title>Poen RHS</title>
	</head>
	<body oncontextmenu="return blockRightClick()">
		<div id="main">
			<div>
				<img src='base/img/poen.png' width='10%' height='10%'></img>
			</div>
			<div>
				<h1>Poen RHS</h1>
				<span style=" font: italic bold 0.3em/1em Georgia, serif;"><p><center>(Remanuafacturing History System) Ver.<font color="red"> 2.50</font></center></p></span>
				<span style=" font: italic bold 0.3em/1em Georgia, serif;"><p><center><font id='auto_backup_db_status' color="gray"></font></center></p></span>
				<span style=" font: italic bold 0.6em/1em Georgia, serif; color: green;"><p style="float: right;" id=login_info></p></span>
			</div>
			</br>
			<div class="buttons">
				<button class="round-btn" id='login_btn' onclick="pre_관리번호 = ''; loadPage('base/login.html'); change_label();">로그인</button>
				<button class="round-btn" onclick="pre_관리번호 = ''; loadPage('base/bsa_info.html'); flag_재제조현황 = true;">재제조 DATA</button>
				<button class="round-btn" id='item_detail_btn' onclick="pre_관리번호 = ''; loadPage('base/item-details.html'); flag_상세입력 = true;">품목상세 입력</button>
				<button class="round-btn" onclick="pre_관리번호 = ''; loadPage('base/type-status.html'); flag_생산현황 = true;">품번 현황</button>
				<button class="round-btn" onclick="pre_관리번호 = ''; loadPage('base/dashboard.html'); flag_대시보드 = true;">대시 보드</button>
				<button class="round-btn" onclick="pre_관리번호 = ''; loadPage('base/재충전정보.html'); flag_재충전정보 = true;">재충전정보</button>
				<button class="round-btn" onclick="pre_관리번호 = ''; loadPage('base/camera.html'); flag_camera = true;">사진 촬영</button>
				<button class="round-btn" onclick="pre_관리번호 = ''; loadPage('base/ETC.html');">ETC</button>
				<div id='부품재고_btn'>
					<button class="round-btn" onclick="pre_관리번호 = ''; loadPage('base/부품재고.html'); flag_부품재고 = true;">부품재고</button>
				</div>
				<button class="round-btn" onclick="pre_관리번호 = ''; times_show();">기간별 현황</button>
				<div id='admin_btn'>
					<button class="round-btn" onclick="pre_관리번호 = ''; loadPage('base/admin.html'); flag_관리자 = true; ">관리자</button>
				</div>
				<div id='times'>
					<button class="round-btn" onclick="loadPage('base/year-status.html' ); flag_년간현황 = true;">년간 현황</button>
					<button class="round-btn" onclick="loadPage('base/month-status.html'); flag_월간현황 = true;">월간 현황</button>
					<button class="round-btn" onclick="loadPage('base/week-status.html'  ); flag_주간현황 = true;">주간 현황</button>
				</div>
			</div>
			<div id="content">
			</div>
		</div>
		
		<script src="base/js/xlsx.full.min.js"></script>
		<script src="base/js/aes.js"></script>
		<script src="base/js/script.js"></script>

		<script src="base/js/jquery-3.6.4.js"></script>
		<script src="base/js/tabulator.js"></script>
		<script src="base/js/chart.js"></script>
		<script src="base/js/luxon.min.js"></script>
		<script src="base/js/poenRHS.js"></script>

		<script src="base/js/EOL.js"></script>
		<script src="base/js/고품정보.js"></script>
		<script src="base/js/신품정보.js"></script>
		<script src="base/js/부품재고.js"></script>
		<script src="base/js/교체부품상세.js"></script>
		<script src="base/js/특이사항.js"></script>
		<script src="base/js/bsa_info.js"></script>
		<script src="base/js/week-status.js"></script>
		<script src="base/js/month-status.js"></script>
		<script src="base/js/year-status.js"></script>
		<script src="base/js/type-status.js"></script>
		<script src="base/js/dashboard.js"></script>
		<script src="base/js/d3@7"></script>
		<script src="base/js/aes.js"></script>

		<script src='base/js/camera.js'></script>

		<script src="base/js/login.js"></script>
		<script src="base/js/main.js"></script>
	</body>
</html>
