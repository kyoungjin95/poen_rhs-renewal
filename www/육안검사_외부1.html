<html>
	<head>
		<title>육안 검사 - 외부 1</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="base/style/공정.css">
	</head>
	<body>
		<div>
			<table border="2" id="tb">
				<tr>
					<td class='base'>
						<label for="management_id"><b>관리번호</b></label>
					</td>
					<td class='base'>
						<input type="text" id="_management_id" value="조회 버튼을 누르세요" size="40" required>
						<button onClick="기초보고서_조회();">조 회</button>
					</td>
				</tr>
				<tr>
					<td class='base'>
						<label for="_재제조번호"><b>재제조번호</b></label>
					</td>
					<td class='base'>
						<input type="text" id="_재제조번호" value="조회 버튼을 누르세요" size="40" required>

					</td>
				</tr>
			</table>

			<div align='left'>
				▣  육안 검사 - 외부 1
			</div>
			<div id='line'>
			</div>
			<div>
				<table class='all'>
					<tr>
						<td class='base_header'>
							TOP
						</td>
						<td class='base_header'>
							FRONT
						</td>
						<td class='base_header'>
							LEFT
						</td>
					</tr>
					<tr>
						<td id='top_pic' class='base_header'>
						</td>
						<td id='front_pic' class='base_header'>
						</td>
						<td id='left_pic' class='base_header'>
						</td>
					</tr>
					<tr>
						<td class='base_header'>
							BOTTOM
						</td>
						<td class='base_header'>
							REAR
						</td>
						<td class='base_header'>
							RIGHT
						</td>
					</tr>
					<tr>
						<td id='bottom_pic' class='base_header'>
						</td>
						<td id='rear_pic' class='base_header'>
						</td>
						<td id='right_pic' class='base_header'>
						</td>
					</tr>
				</table>
			</div>
			<div>
				<table class='bottom' width='100%'>
					<tr>
						<td class='bottom' align='left'>
							FQ850-05
						</td>
						<td class='bottom' align=center>
							A4(297x210mm)
						</td>
						<td class='bottom' align='right'>
							Positive <font color='skyblue'>En</font>ergy
						</td>
					</tr>
				</table>
			</div>
		</div>
		<div>
			<canvas id='_canvas'></canvas>
		</div>
		<div>
			<button onClick='육안검사외부1_save();">SAVE</button>
		</div>
		<script>
			var _management_id = document.getElementById('_management_id');
			var _재제조번호 = document.getElementById('_재제조번호');
		</script>
	</body>
</html>
