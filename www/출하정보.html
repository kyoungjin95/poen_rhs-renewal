<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>출하검사</title>
  </head>

  <body>
    <section class="page page-출하검사">
      <header class="page-header">
        <h2 class="page-title">출하검사</h2>
      </header>

      <!-- 검색 & 리스트 -->
      <div class="card">
        <h2 class="card-title">목록 조회</h2>
        <div class="gather-filter">
          <select id="filter-field">
            <option></option>
            <option value="관리번호">관리번호</option>
            <option value="재제조번호">재제조번호</option>
            <option value="구분">구분</option>
            <option value="차종">차종</option>
            <option value="품번">품번</option>
            <option value="RO_no">RO_no</option>
            <option value="공정단계">공정단계</option>
            <option value="입고">입고</option>
            <option value="제조투입">제조투입</option>
            <option value="세척">세척</option>
            <option value="기초검사">기초검사</option>
            <option value="분해조립">분해조립</option>
            <option value="성능검사">성능검사</option>
            <option value="EOL">EOL</option>
            <option value="출하검사">출하검사</option>
            <option value="납품처">납품처</option>
            <option value="출하">출하</option>
          </select>
          <select id="filter-type">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value="<="><=</option>
            <option value=">">></option>
            <option value=">=">>=</option>
            <option value="!=">!=</option>
            <option value="like">like</option>
          </select>
          <input id="filter-value" type="text" placeholder="검색어" />
          <button id="filter-clear">필터 초기화</button>
          <button onClick="출하정보_list();" class="btn-primary">LIST</button>
        </div>
        <div id="grid_list"></div>
      </div>

      <!-- 기본 정보 -->
      <div class="card">
        <h2 class="card-title">기본 정보</h2>
        <div class="form-grid">
          <div class="field">
            <label for="_management_id">관리번호</label>
            <div class="field-input">
              <input type="text" id="_management_id" value="" required />
              <button onClick="출하정보_시작(0);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_재제조번호">재제조번호</label>
            <div class="field-input">
              <input type="text" id="_재제조번호" value="" required />
              <button onClick="출하정보_시작(1);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_RO_no">RO no.</label>
            <div class="field-input">
              <input type="text" id="_RO_no" required />
              <button onClick="출하정보_시작(2);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_출하코드">출하코드</label>
            <input type="text" id="_출하코드" required />
          </div>
          <div class="field">
            <label for="_검사일">검사일</label>
            <input type="datetime-local" id="_검사일" value="0000-00-00T00:00" required />
          </div>
          <div class="field">
            <label for="_검사자">검사자</label>
            <input type="text" id="_검사자" required />
          </div>
          <div class="field">
            <label for="_차종">차종</label>
            <input type="text" id="_차종" readonly />
          </div>
          <div class="field">
            <label for="_품번">품번</label>
            <input type="text" id="_품번" readonly />
          </div>
        </div>
      </div>

      <!-- 관리문서 및 보고서 -->
      <div class="card">
        <h2 class="card-title">관리문서 및 보고서</h2>
        <div class="form-grid">
          <div class="field full">
            <label for="_기초보고서_작성확인">기초보고서 작성확인 (입고증상/진단결과)</label>
            <div class="field-input">
              <input type="text" id="_기초보고서_작성확인" required />
              <select id="s1" onchange="_기초보고서_작성확인_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field full">
            <label for="_완료보고서_작성확인">완료보고서 작성확인 (교체부품)</label>
            <div class="field-input">
              <input type="text" id="_완료보고서_작성확인" required />
              <select id="s2" onchange="_완료보고서_작성확인_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- 육안 검사 -->
      <div class="card">
        <h2 class="card-title">육안 검사</h2>
        <div class="form-grid">
          <div class="field">
            <label for="_클린상태">클린 상태</label>
            <div class="field-input">
              <input type="text" id="_클린상태" required />
              <select id="s3" onchange="_클린상태_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_팔레트_적정위치">팔레트 적정위치</label>
            <div class="field-input">
              <input type="text" id="_팔레트_적정위치" required />
              <select id="s4" onchange="_팔레트_적정위치_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_포장랩상태">포장랩 상태</label>
            <div class="field-input">
              <input type="text" id="_포장랩상태" required />
              <select id="s5" onchange="_포장랩상태_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_UPR_QR">UPR QR</label>
            <div class="field-input">
              <input type="text" id="_UPR_QR" required />
              <select id="s6" onchange="_UPR_QR_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_LWR_QR">LWR QR</label>
            <div class="field-input">
              <input type="text" id="_LWR_QR" required />
              <select id="s7" onchange="_LWR_QR_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_HKMC_스티커_URP">HKMC 스티커 URP</label>
            <div class="field-input">
              <input type="text" id="_HKMC_스티커_URP" required />
              <select id="s8" onchange="_HKMC_스티커_URP_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_냉각유로_커버">냉각유로 커버 2개소</label>
            <div class="field-input">
              <input type="text" id="_냉각유로_커버" required />
              <select id="s9" onchange="_냉각유로_커버_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- 장착물 부착여부 -->
      <div class="card">
        <h2 class="card-title">장착물 부착여부</h2>
        <div class="form-grid">
          <div class="field">
            <label>브라켓 <span style="color: var(--text-muted); font-size: 11px">(브라켓 4개)</span></label>
            <div class="field-input">
              <select id="_bracket" onchange="_브라켓_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_브라켓_비고" placeholder="비고" required />
            </div>
            <input type="hidden" id="_브라켓" />
          </div>
          <div class="field">
            <label>S/PLUG <span style="color: var(--text-muted); font-size: 11px">(장착되어 있을 것)</span></label>
            <div class="field-input">
              <select id="_S_PLUG" onchange="_S_PLUG_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_S_PLUG_비고" placeholder="비고" required />
            </div>
          </div>
          <div class="field">
            <label>접지 <span style="color: var(--text-muted); font-size: 11px">(장착되어 있을 것)</span></label>
            <div class="field-input">
              <select id="_접지" onchange="_접지_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_접지_비고" placeholder="비고" required />
            </div>
          </div>
        </div>
      </div>

      <!-- 출하 검사 -->
      <div class="card">
        <h2 class="card-title">출하 검사</h2>
        <div class="form-grid">
          <div class="field full">
            <label for="_DTC">DTC</label>
            <div class="field-input">
              <input type="text" id="_DTC" />
              <select id="s10" onchange="_DTC_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_DTC_현재" placeholder="현재" />
              <input type="text" id="_DTC_과거" placeholder="과거" />
            </div>
          </div>
          <div class="field full">
            <label for="_배터리충전상태">배터리 충전 상태 (%)</label>
            <div class="field-input">
              <input type="text" id="_배터리충전상태" />
              <select id="s11" onchange="_배터리충전상태_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_배터리충전상태_측정값" placeholder="측정값" />
            </div>
          </div>
          <div class="field">
            <label for="_BMS고장NO">BMS 고장 NO</label>
            <div class="field-input">
              <input type="text" id="_BMS고장NO" />
              <select id="s12" onchange="_BMS고장NO_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_BMS융착NO">BMS 융착 NO</label>
            <div class="field-input">
              <input type="text" id="_BMS융착NO" />
              <select id="s13" onchange="_BMS융착NO_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field full">
            <label for="_배터리팩전압">배터리 팩 전압 (V)</label>
            <div class="field-input">
              <input type="text" id="_배터리팩전압" />
              <select id="s14" onchange="_배터리팩전압_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_배터리팩_측정값" placeholder="측정값" />
            </div>
          </div>
          <div class="field full">
            <label for="_배터리모듈온도">배터리 모듈 온도 (℃)</label>
            <div class="field-input">
              <input type="text" id="_배터리모듈온도" />
              <select id="s15" onchange="_배터리모듈온도_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_배터리모듈온도_최대" placeholder="최대" />
              <input type="text" id="_배터리모듈온도_최소" placeholder="최소" />
            </div>
          </div>
          <div class="field full">
            <label for="_배터리셀전압">배터리 셀 전압 (V)</label>
            <div class="field-input">
              <input type="text" id="_배터리셀전압" />
              <select id="s16" onchange="_배터리셀전압_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_배터리셀전압_최대" placeholder="최대" />
              <input type="text" id="_배터리셀전압_최소" placeholder="최소" />
            </div>
          </div>
          <div class="field full">
            <label for="_셀전압편차">셀 전압 편차 (mV)</label>
            <div class="field-input">
              <input type="text" id="_셀전압편차" />
              <select id="s17" onchange="_셀전압편차_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_셀전압편차_측정값" placeholder="측정값" />
            </div>
          </div>
          <div class="field full">
            <label for="_절연저항">절연저항 (kΩ) - GDS</label>
            <div class="field-input">
              <input type="text" id="_절연저항" />
              <select id="s18" onchange="_절연저항_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
              <input type="text" id="_절연저항_측정값" placeholder="측정값" />
            </div>
          </div>
          <div class="field">
            <label for="_SOH">SOH 100%</label>
            <div class="field-input">
              <input type="text" id="_SOH" />
              <select id="s19" onchange="_SOH_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_릴레이_강제구동">릴레이 강제구동 - GDS <span style="color: var(--text-muted); font-size: 11px">(승용 모델)</span></label>
            <div class="field-input">
              <input type="text" id="_릴레이_강제구동" />
              <select id="s20" onchange="_릴레이_강제구동_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
          <div class="field full">
            <label for="_커넥터_체결검사">커넥터 체결검사 <span style="color: var(--text-muted); font-size: 11px">(DE/OS/SK3: 진단프로그램 / CV: GDS)</span></label>
            <div class="field-input">
              <input type="text" id="_커넥터_체결검사" />
              <select id="s21" onchange="_커넥터_체결검사_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
                <option value="조치완료">조치완료</option>
              </select>
            </div>
          </div>
        </div>
        <div style="margin-top: 16px; padding: 12px 14px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px; color: var(--text-secondary); line-height: 1.6">
          <div>· 출하검사 완료된 제품에 한하여 QC PASS 스티커를 부착한다.</div>
          <div>· 배터리 온도는 최대/최소 값이 아닌 온도센서 개별 센싱값 모두 확인할 것</div>
          <div>· 부착물 재고 없을 시 반드시 영업팀에 확인하여 협의할 것</div>
        </div>
      </div>

      <!-- 액션 -->
      <div class="form-actions">
        <button onClick="이전페이지();" class="btn-secondary">이전 페이지</button>
        <button onClick="출하정보_save();" class="btn-primary">저장</button>
      </div>
    </section>

    <script>
      var _management_id = document.getElementById('_management_id');
      var _재제조번호 = document.getElementById('_재제조번호');
      var _RO_no = document.getElementById('_RO_no');
      var _출하코드 = document.getElementById('_출하코드');
      var _검사일 = document.getElementById('_검사일');
