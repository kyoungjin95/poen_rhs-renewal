<html>
	<head>
		<title>품목 상세 입력</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="base/style/item-detail.css">
	</head>
	<body>
		<div class="품목상세">
			<div>
				<center>
					<label><h2><b>품목 상세</b></h2></label>
				</center>
			</div>
			<div class="input-group">
				<table border='2'>
				<tr>
					<td>
						<label for="_management_id"><b>관리번호</b></label>
					</td>
					<td>
						<input type="text" id="_management_id" size="40" required>
						<button onClick="상세입력_시작();">조 회</button>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_재제조번호"><b>재제조번호</b></label>
					</td>
					<td>
						<input type="text" id="_재제조번호" size="40" required>
						<button onClick="상세입력_시작(true);">조 회</button>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_구분"><b>구분</b></label>
					</td>
					<td>
						<input type="text" id="_구분" size="40" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_차종"><b>차종</b></label>
					</td>
					<td>
						<input type="text" id="_차종" size="40" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_품번"><b>품번</b></label>
					</td>
					<td>
						<input type="text" id="_품번" size="40" readonly required>
					</td>
				</td>
				<tr>
					<td>
						<label for="_RO_no"><b>RO_no</b></label>
					</td>
					<td>
						<input type="text" id="_RO_no" size="40" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_공정단계"><b>공정단계</b></label>
					</td>
					<td>
						<input type="text" id="_공정단계" size="40" readonly required>
						<select name="language" onchange="공정입력_콤보박스(this)">
							<option value="">---</option>
							<option value="입고">입고</option>
							<option value="제조투입">제조투입</option>
							<option value="세척">세척</option>
							<option value="기초검사">기초검사</option>
							<option value="분해조립">분해조립</option>
							<option value="성능검사">성능검사</option>
							<option value="EOL">EOL</option>
							<option value="제조완료">제조완료</option>
							<option value="출하검사">출하검사</option>
							<option value="출하">출하</option>
						</select>
						<button onClick="processStep();">공정 상세 입력</button>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_적재No"><b>적재No</b></label>
					</td>
					<td>
						<input type="text" id="_적재No" size="40" required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_입고"><b>입고</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_입고" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_제조투입"><b>제조투입</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_제조투입" value="0000-00-00T00:00" required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_세척투입일"><b>세척투입일</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_세척투입일" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_세척"><b>세척</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_세척" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_기초검사투입일"><b>기초검사투입일</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_기초검사투입일" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_기초검사"><b>기초검사</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_기초검사" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_분해조립투입일"><b>분해조립투입일</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_분해조립투입일" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_분해조립"><b>분해조립</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_분해조립" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_성능검사투입일"><b>성능검사투입일</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_성능검사투입일" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_성능검사"><b>성능검사</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_성능검사" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_EOL투입일"><b>EOL투입일</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_EOL투입일" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_EOL"><b>EOL</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_EOL" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_출하"><b>출하</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_출하" value="0000-00-00T00:00" readonly required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_소재지"><b>소재지</b></label>
					</td>
					<td>
						<input type="text" id="_소재지" size="40" required>
						<select name="language" onchange="소재지_콤보박스(this)">
							<option value="">---</option>
							<option value="마도">마도</option>
							<option value="구장">구장</option>
							<option value="폐기">폐기</option>
						</select>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_마지막충전일"><b>마지막 충전일</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_마지막충전일" value="0000-00-00T00:00" required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_반품입고"><b>반품입고</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_반품입고" value="0000-00-00T00:00" required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_재출하"><b>재출하</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_재출하" value="0000-00-00T00:00" required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_완전분해"><b>완전분해</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_완전분해" value="0000-00-00T00:00" required>
					</td>
				</tr>
				<tr>
					<td>
						<label for="_폐기"><b>폐기</b></label>
					</td>
					<td>
						<input type="datetime-local" id="_폐기" value="0000-00-00T00:00" required>
					</td>
				</tr>
				<tr>
					<td>
						<label><b>고품정보등록</b></label>
					</td>
					<td>
						<button onClick="func_고품정보등록();">고품정보 등록</button>
					</td>
				</tr>
				<tr>
					<td>
						<label><b>특이사항</b></label>
					</td>
					<td>
						<button onClick="func_특이사항();">특이 사항</button>
					</td>
				</tr>
				<tr>
				</table>
				<div class="input-group">
					<center>
						<button onClick="item_detail_save();">SAVE</button>
					</center>
				</div>
			</div>
			<script>
				const _management_id = document.getElementById('_management_id');
				const _재제조번호 = document.getElementById('_재제조번호');
				const _구분 = document.getElementById('_구분');
				const _차종 = document.getElementById('_차종');
				const _품번 = document.getElementById('_품번');
				const _RO_no = document.getElementById('_RO_no');
				const _공정단계 = document.getElementById('_공정단계');
				const _적재No = document.getElementById('_적재No');
				const _입고 = document.getElementById('_입고');
				const _제조투입 = document.getElementById('_제조투입');
				const _세척투입일 = document.getElementById('_세척투입일');
				const _세척 = document.getElementById('_세척');
				const _기초검사투입일 = document.getElementById('_기초검사투입일');
				const _기초검사 = document.getElementById('_기초검사');
				const _분해조립투입일 = document.getElementById('_분해조립투입일');
				const _분해조립 = document.getElementById('_분해조립');
				const _성능검사투입일 = document.getElementById('_성능검사투입일');
				const _성능검사 = document.getElementById('_성능검사');
				const _EOL투입일 = document.getElementById('_EOL투입일');
				const _EOL = document.getElementById('_EOL');
				const _QR_Label = document.getElementById('_QR_Label');
				const _출하 = document.getElementById('_출하');
				const _소재지 = document.getElementById('_소재지');
				const _반품입고 = document.getElementById('_반품입고');
				const _재출하 = document.getElementById('_재출하');
				const _완전분해 = document.getElementById('_완전분해');
				const _폐기 = document.getElementById('_폐기');
			</script>

</html>
