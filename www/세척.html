<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배터리팩정보입력 - 세척</title>
  </head>

  <body>
    <section class="page page-세척">
      <header class="page-header">
        <h2 class="page-title">세척</h2>
      </header>

      <!-- 검색 & 리스트 -->
      <div class="card">
        <h2 class="card-title">목록 조회</h2>
        <div class="gather-filter">
          <select id="filter-field">
            <option></option>
            <option value="관리번호">관리번호</option>
            <option value="재제조번호">재제조번호</option>
            <option value="구분">구분</option>
            <option value="차종">차종</option>
            <option value="품번">품번</option>
            <option value="RO_no">RO_no</option>
            <option value="공정단계">공정단계</option>
            <option value="적재No">적재No</option>
            <option value="입고">입고</option>
            <option value="제조투입">제조투입</option>
            <option value="세척투입일">세척투입일</option>
            <option value="세척">세척</option>
            <option value="기초검사투입">기초검사투입</option>
            <option value="기초검사">기초검사</option>
            <option value="분해조립투입">분해조립투입</option>
            <option value="분해조립">분해조립</option>
            <option value="성능검사투입">성능검사투입</option>
            <option value="성능검사">성능검사</option>
            <option value="EOL투입일">EOL투입일</option>
            <option value="EOL">EOL</option>
            <option value="출하검사">출하검사</option>
            <option value="납품처">납품처</option>
            <option value="출하">출하</option>
            <option value="소재지">소재지</option>
            <option value="반품입고">반품입고</option>
            <option value="재출하">재출하</option>
            <option value="완전분해">완전분해</option>
            <option value="폐기">폐기</option>
            <option value="마지막충전일">마지막충전일</option>
          </select>

          <select id="filter-type">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value="<="><=</option>
            <option value=">">></option>
            <option value=">=">>=</option>
            <option value="!=">!=</option>
            <option value="like">like</option>
          </select>

          <input id="filter-value" type="text" placeholder="검색어" />

          <button id="filter-clear">필터 초기화</button>
          <button onClick="세척_list();" class="btn-primary">LIST</button>
        </div>
        <div id="grid_list"></div>
      </div>

      <!-- 기본 정보 -->
      <div class="card">
        <h2 class="card-title">기본 정보</h2>
        <div class="form-grid">
          <div class="field">
            <label for="_management_id">관리번호</label>
            <div class="field-input">
              <input type="text" id="_management_id" value="" required />
              <button onClick="세척_시작(0);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_재제조번호">재제조번호</label>
            <div class="field-input">
              <input type="text" id="_재제조번호" value="" required />
              <button onClick="세척_시작(1);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_RO_no">RO No.</label>
            <div class="field-input">
              <input type="text" id="_RO_no" value="" required />
              <button onClick="세척_시작(2);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_구분">구분</label>
            <input type="text" id="_구분" readonly required />
          </div>
          <div class="field">
            <label for="_차종">차종</label>
            <input type="text" id="_차종" readonly required />
          </div>
          <div class="field">
            <label for="_품번">품번</label>
            <input type="text" id="_품번" readonly required />
          </div>
          <div class="field">
            <label for="_VIN">VIN</label>
            <input type="text" id="_VIN" required />
          </div>
          <div class="field">
            <label for="_">Serial No.</label>
            <input type="text" id="_sn" required />
          </div>
          <div class="field">
            <label for="_공정입고일">공정 입고일</label>
            <input type="datetime-local" id="_공정입고일" value="0000-00-00T00:00" required />
          </div>
          <div class="field">
            <label for="_공정완료일">공정 완료일</label>
            <input type="datetime-local" id="_공정완료일" value="0000-00-00T00:00" required />
          </div>
        </div>
      </div>

      <!-- 검사 항목 -->
      <div class="card">
        <h2 class="card-title">검사 항목</h2>

        <div class="form-grid">
          <div class="field full">
            <label for="_어퍼케이스재사용가능">어퍼케이스 재사용가능</label>
            <div class="field-input">
              <input type="text" id="_어퍼케이스재사용가능" required />
              <select name="language" onchange="_어퍼케이스재사용가능_콤보박스(this);">
                <option value="">---</option>
                <option value="OK">OK</option>
                <option value="NG">NG</option>
              </select>
            </div>
          </div>
        </div>

        <div id="_기밀검사_케이스_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_기밀검사_케이스">기밀검사 케이스</label>
              <div class="field-input">
                <input type="text" id="_기밀검사_케이스" required />
                <select name="language" onchange="_기밀검사_케이스_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
              </div>
            </div>
          </div>
          <div id="_기밀검사_케이스_img" class="image-grid">
            <div class="image-slot"><img id="_img1" /></div>
            <div class="image-slot"><img id="_img2" /></div>
          </div>
        </div>

        <div id="_기밀검사_케이스_특이사항_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_기밀검사_케이스_특이사항">기밀검사 케이스 특이사항</label>
              <input type="text" id="_기밀검사_케이스_특이사항" />
            </div>
          </div>
          <div id="_기밀검사_케이스_특이사항_img" class="image-grid">
            <div class="image-slot"><img id="_img3" /></div>
            <div class="image-slot"><img id="_img4" /></div>
          </div>
        </div>

        <div id="_육안검사_외부_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_육안검사_외부">육안검사 외부</label>
              <div class="field-input">
                <input type="text" id="_육안검사_외부" required />
                <select name="language" onchange="_육안검사외부_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
              </div>
            </div>
          </div>
          <div id="_육안검사_외부_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">top</span><img id="_img5" /></div>
            <div class="image-slot"><span class="image-label">front</span><img id="_img6" /></div>
            <div class="image-slot"><span class="image-label">left</span><img id="_img7" /></div>
            <div class="image-slot"><span class="image-label">bottom</span><img id="_img8" /></div>
            <div class="image-slot"><span class="image-label">rear</span><img id="_img9" /></div>
            <div class="image-slot"><span class="image-label">right</span><img id="_img10" /></div>
          </div>
        </div>

        <div id="_육안검사_외부_특이사항_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_육안검사_외부_특이사항">육안검사 외부 특이사항</label>
              <input type="text" id="_육안검사_외부_특이사항" />
            </div>
          </div>
          <div id="_육안검사_외부_특이사항_img" class="image-grid">
            <div class="image-slot"><img id="_img11" /></div>
            <div class="image-slot"><img id="_img12" /></div>
            <div class="image-slot"><img id="_img13" /></div>
            <div class="image-slot"><img id="_img14" /></div>
          </div>
        </div>

        <div id="_특이사항_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_특이사항">특이사항</label>
              <input type="text" id="_특이사항" />
            </div>
          </div>
          <div class="image-grid">
            <div class="image-slot"><img id="_img15" /></div>
          </div>
        </div>
      </div>

      <!-- 액션 -->
      <div class="form-actions">
        <button onClick="이전페이지();" class="btn-secondary">이전 페이지</button>
        <button onClick="세척_save();" class="btn-primary">저장</button>
      </div>
    </section>

    <script>
      const _management_id = document.getElementById('_management_id');
      const _재제조번호 = document.getElementById('_재제조번호');
      const _RO_no = document.getElementById('_RO_no');
      const _구분 = document.getElementById('_구분');
      const _차종 = document.getElementById('_차종');
      const _품번 = document.getElementById('_품번');
      const _VIN = document.getElementById('_VIN');
      const _sn = document.getElementById('_sn');
      const _공정입고일 = document.getElementById('_공정입고일');
      const _공정완료일 = document.getElementById('_공정완료일');
      const _어퍼케이스재사용가능 = document.getElementById('_어퍼케이스재사용가능');
      const _기밀검사_케이스 = document.getElementById('_기밀검사_케이스');
      const _기밀검사_케이스_특이사항 = document.getElementById('_기밀검사_케이스_특이사항');
      const _육안검사_외부 = document.getElementById('_육안검사_외부');
      const _육안검사_외부_특이사항 = document.getElementById('_육안검사_외부_특이사항');
      const _특이사항 = document.getElementById('_특이사항');
      const _기밀검사_케이스_box = document.getElementById('_기밀검사_케이스_box');
      const _기밀검사_케이스_img = document.getElementById('_기밀검사_케이스_img');
      const _기밀검사_케이스_특이사항_box = document.getElementById('_기밀검사_케이스_특이사항_box');
      const _기밀검사_케이스_특이사항_img = document.getElementById('_기밀검사_케이스_특이사항_img');
      const _육안검사_외부_box = document.getElementById('_육안검사_외부_box');
      const _육안검사_외부_특이사항_box = document.getElementById('_육안검사_외부_특이사항_box');
      const _특이사항_box = document.getElementById('_특이사항_box');
      const _육안검사_외부_img = document.getElementById('_육안검사_외부_img');
      const _육안검사_외부_특이사항_img = document.getElementById('_육안검사_외부_특이사항_img');
      const _img1 = document.getElementById('_img1');
      const _img2 = document.getElementById('_img2');
      const _img3 = document.getElementById('_img3');
      const _img4 = document.getElementById('_img4');
      const _img5 = document.getElementById('_img5');
      const _img6 = document.getElementById('_img6');
      const _img7 = document.getElementById('_img7');
      const _img8 = document.getElementById('_img8');
      const _img9 = document.getElementById('_img9');
      const _img10 = document.getElementById('_img10');
      const _img11 = document.getElementById('_img11');
      const _img12 = document.getElementById('_img12');
      const _img13 = document.getElementById('_img13');
      const _img14 = document.getElementById('_img14');
      const _img15 = document.getElementById('_img15');

      // 이미지 핸들러 — 페이지 진입 직후 한 번 등록
      // 클릭: 파일 선택 다이얼로그 / 더블클릭: 삭제 / 드래그&드롭: 추가
      [_img1, _img2, _img3, _img4, _img5, _img6, _img7, _img8, _img9, _img10, _img11, _img12, _img13, _img14, _img15].forEach(function (img) {
        if (!img) return;
        img.onclick = function () {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.onchange = function (e) {
            if (e.target.files && e.target.files.length > 0) {
              resize_pic(e.target.files[0], img);
            }
          };
          input.click();
        };
        img.ondblclick = function () {
          img.src = '';
        };
        img.ondragover = function (evt) {
          evt.preventDefault();
        };
        img.ondrop = function (evt) {
          evt.preventDefault();
          var files = evt.dataTransfer && evt.dataTransfer.files;
          if (files && files.length > 0) {
            resize_pic(files[0], img);
          }
        };
      });
    </script>
  </body>
</html>
