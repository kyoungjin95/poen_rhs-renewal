<html>
	<head>
		<title>세척</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="style/item-detail.css">
	</head>
	<body>
		<div class="세척">
			<div>
				<center>
					<label><h2><b>세척</b></h2></label>
				</center>
			</div>
			<div>
				<center>
					<table border="2">
						<tr>
							<td>
								<label for="management_id"><b>관리번호</b></label>
							</td>
							<td>
								<input type="text" id="_management_id" value="조회 버튼을 누르세요" size="30" required>
								<button onClick="세척_managementID();">조 회</button>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_공정입고일"><b>공정 입고일</b></label>
							</td>
							<td>
								<input type="datetime-local" id="_공정입고일" value="0000-00-00T00:00" size="30" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_공정완료일"><b>공정 완료일</b></label>
							</td>
							<td>
								<input type="datetime-local" id="_공정완료일" value="0000-00-00T00:00" size="30" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_특이사항"><b>특이사항</b></label>
							</td>
							<td>
								<input type="text" id="_특이사항" size="100" required>
							</td>
						</tr>
					</table>
				</center>
			</div>
			<div class="input-group">
				<center>
					<button onClick="세척_save();">SAVE</button>
					<button onClick="이전페이지();">이전 Page</button>
				</center>
			</div>
			<script>
				const _management_id = document.getElementById('_management_id');
				const _공정입고일 = document.getElementById('_공정입고일');
				const _공정완료일 = document.getElementById('_공정완료일');
				const _특이사항 = document.getElementById('_특이사항');
			</script>
	</body>
</html>
