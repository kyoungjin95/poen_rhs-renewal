<html>
	<head>
		<title>세척</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="base/style/item-detail.css">
	</head>
	<body>
		<div class="세척">
			<div>
				<center>
					<label><h2><b>세척</b></h2></label>
				</center>
			</div>
			<div>
				<center>
					<table border="2">
						<tr>
							<td>
								<label for="_management_id"><b>관리번호</b></label>
							</td>
							<td>
								<input type="text" id="_management_id" value="조회 버튼을 누르세요" size="40" required>
								<button onClick="세척_시작();">조 회</button>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_재제조번호"><b>재제조번호</b></label>
							</td>
							<td>
								<input type="text" id="_재제조번호" value="조회 버튼을 누르세요" size="40" required>
								<button onClick="세척_재제조번호_시작();">조 회</button>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_공정입고일"><b>공정 입고일</b></label>
							</td>
							<td>
								<input type="datetime-local" id="_공정입고일" value="0000-00-00T00:00" size="40" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_공정완료일"><b>공정 완료일</b></label>
							</td>
							<td>
								<input type="datetime-local" id="_공정완료일" value="0000-00-00T00:00" size="40" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_기밀검사_케이스"><b>기밀검사 케이스</b></label>
							</td>
							<td>
								<input type="text" id="_기밀검사_케이스" size="40" required>
								<select name="language" onchange="_기밀검사_케이스_콤보박스(this);">
									<option value="">---</option>
									<option value="OK">OK</option>
									<option value="NG">NG</option>
								</select>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_기밀검사_케이스_특이사항"><b>기밀검사 케이스 특이사항</b></label>
							</td>
							<td>
								<input type="text" id="_기밀검사_케이스_특이사항" size="100" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_특이사항"><b>특이사항</b></label>
							</td>
							<td>
								<input type="text" id="_특이사항" size="100" required>
							</td>
						</tr>
					</table>
				</center>
			</div>
			<div class="input-group">
				<center>
					<button onClick="세척_save();">SAVE</button>
					<button onClick="이전페이지();">이전 Page</button>
					<button onClick="세척_카메라시작();">사진촬영</button>
				</center>
			</div>
			<script>
				const _management_id = document.getElementById('_management_id');
				const _재제조번호 = document.getElementById('_재제조번호');
				const _공정입고일 = document.getElementById('_공정입고일');
				const _공정완료일 = document.getElementById('_공정완료일');
				const _특이사항 = document.getElementById('_특이사항');
			</script>
	</body>
</html>
