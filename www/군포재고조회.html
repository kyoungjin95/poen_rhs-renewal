<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>군포창고 재고 현황</title>
    <link rel="stylesheet" href="base/style/camera.css" />
  </head>

  <body>
    <section class="page page-군포재고조회">
      <header class="page-header">
        <h2 class="page-title">군포창고 배터리팩 재고 현황</h2>
      </header>

      <!-- 조회 -->
      <div class="card">
        <h2 class="card-title">조회 조건</h2>
        <div class="data__query">
          <div class="data-period-btns">
            <button onClick="군포_수량집계_year();" class="btn-secondary">Year</button>
            <button onClick="군포_수량집계_month();" class="btn-secondary">Month</button>
          </div>
          <div class="data-check">
            <input type="date" id="_검색일_from" value="0000-00-00" max="240-12-4" required />
            <span class="tilde">~</span>
            <input type="date" id="_검색일_to" value="0000-00-00" max="240-12-4" required />
            <button onClick="군포_수량집계_기간조회();" class="btn-primary">조회</button>
          </div>
        </div>
      </div>

      <!-- 재고 목록 -->
      <div class="card">
        <h2 class="card-title">재고 목록</h2>
        <div class="gather-filter">
          <select id="filter-field">
            <option></option>
            <option value="관리번호">관리번호</option>
            <option value="재제조번호">재제조번호</option>
            <option value="입고일">입고일</option>
            <option value="입고처">입고처</option>
            <option value="RO번호">RO번호</option>
            <option value="부품번호">부품번호</option>
            <option value="생산연도">생산연도</option>
            <option value="ROM_ID">ROM ID</option>
            <option value="보관위치">보관위치</option>
            <option value="출고일">출고일</option>
            <option value="출고처">출고처</option>
            <option value="비고">비고</option>
          </select>
          <select id="filter-type">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value="<="><=</option>
            <option value=">">></option>
            <option value=">=">>=</option>
            <option value="!=">!=</option>
            <option value="like">like</option>
          </select>
          <input id="filter-value" type="text" placeholder="검색어" />
          <button id="filter-clear">필터 초기화</button>
        </div>
        <div id="grid_BSA"></div>
        <div class="pb">
          <p class="id__name">선택 관리번호: <span id="select_bsa"></span></p>
          <div class="process__btn">
            <div class="process__btns">
              <button onClick="delete_군포재고_bsa();" class="delete__bsa">삭제</button>
              <button onClick="창고_export_excel();" class="down__excel">Excel 내보내기</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2 class="card-title">품번별 재고</h2>
        <div id="grid_품번_수량집계"></div>
      </div>

      <div class="card">
        <h2 class="card-title">입고처별 재고</h2>
        <div id="grid_입고처_수량집계"></div>
      </div>

      <div class="card">
        <h2 class="card-title">출고처별 재고</h2>
        <div id="grid_출고처_수량집계"></div>
      </div>
    </section>
  </body>
</html>
