<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>비밀번호 변경</title>
  </head>

  <body>
    <section class="page page-passwd">
      <header class="page-header">
        <h2 class="page-title">비밀번호 변경</h2>
      </header>

      <div class="card">
        <h2 class="card-title">비밀번호</h2>
        <div class="form-grid">
          <div class="field full">
            <label for="_old_passwd">현재 비밀번호</label>
            <input type="password" id="_old_passwd" required />
          </div>
          <div class="field full">
            <label for="_passwd1">새 비밀번호</label>
            <input type="password" id="_passwd1" required />
          </div>
          <div class="field full">
            <label for="_passwd2">새 비밀번호 확인</label>
            <input type="password" id="_passwd2" required />
          </div>
        </div>
      </div>

      <div class="form-actions">
        <button onClick="passwd_change();" class="btn-primary">비밀번호 변경</button>
      </div>
    </section>

    <script>
      var _old_passwd = document.getElementById('_old_passwd');
      var _passwd1 = document.getElementById('_passwd1');
      var _passwd2 = document.getElementById('_passwd2');
    </script>
  </body>
</html>
