<html>
	<head>
		<title>BSA 공정제외 수량 현황</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="base/style/공정.css">
	</head>
	<body>
		<div>
			<h1 style="text-align: center;">BSA 공정제외 현황</h1>
		</div>
		<div style="margin: 10px 10px 10px 10px">
			<div>
				<div style="display:flex; flex-wrap: wrap; justify-content: space-between;">
					<div id='일반기타' style="background-color: green; width: 20%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
						<h3 style="color:#fff;">일반 기타</h3>
						<span id="check_num1" style="font-size:3vw; color:#fff;"></span>
					</div>
					<div id='보증기타' style="background-color: orange; width: 20%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
						<h3 style="color:#fff;">보증 기타</h3>
						<span id="check_num2" style="font-size:3vw; color:#fff;"></span>
					</div>
					<div id='완전분해' style="background-color: purple; width: 20%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
						<h3 style="color:#fff;">완전 분해</h3>
						<span id="check_num3" style="font-size:3vw; color:#fff;"></span>
					</div>
					<div id='폐기' style="background-color: brown; width: 20%; margin-bottom: 1vw; padding: 1vw; text-align: center;">
						<h3 style="color:#fff;">폐기</h3>
						<span id="check_num4" style="font-size:3vw; color:#fff;"></span>
					</div>
				</div>
			</div>
		</div>
		<div>
			<div>
				<label id='제외분류' for='grid_제외'></label>
			</div>
			<div id='grid_제외분류'>
			</div>
		</div>
	</body>
</html>
