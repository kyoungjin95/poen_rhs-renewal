<!DOCTYPE html>
<html lang="ko">
  <head>
    <title>배터리팩 공정제외 현황</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="base/style/newstyle.css" />
  </head>

  <body>
    <section class="page page-exclusion">
      <header class="page-header">
        <h2 class="page-title">배터리팩 공정제외 현황</h2>
      </header>

      <!-- 제외 분류 카드 -->
      <div class="card">
        <h2 class="card-title">분류별 수량</h2>
        <div class="stat-grid">
          <div class="stat-card" id="일반기타">
            <div class="stat-icon"><img src="base/img/exclusion_battery.png" alt="일반기타" /></div>
            <h3 class="stat-label">일반기타</h3>
            <div class="stat-value"><span id="check_num1"></span></div>
          </div>
          <div class="stat-card" id="보증기타">
            <div class="stat-icon"><img src="base/img/exclusion_disassembled.png" alt="보증기타" /></div>
            <h3 class="stat-label">보증기타</h3>
            <div class="stat-value"><span id="check_num2"></span></div>
          </div>
          <div class="stat-card" id="완전분해">
            <div class="stat-icon"><img src="base/img/exclusion_warrant.png" alt="완전분해" /></div>
            <h3 class="stat-label">완전분해</h3>
            <div class="stat-value"><span id="check_num3"></span></div>
          </div>
          <div class="stat-card" id="폐기">
            <div class="stat-icon"><img src="base/img/exclusion_dispose.png" alt="폐기" /></div>
            <h3 class="stat-label">폐기</h3>
            <div class="stat-value"><span id="check_num4"></span></div>
          </div>
        </div>
      </div>

      <!-- 제외 분류 상세 표 -->
      <div class="card">
        <h2 class="card-title"><label id="제외분류" for="grid_제외">제외 분류 상세</label></h2>
        <div id="grid_제외분류"></div>
      </div>
    </section>
  </body>
</html>
