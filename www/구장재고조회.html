
<html>
	<head>
		<title>BSA 재제조 현황</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="base/style/공정.css">
		<link rel="stylesheet" href="base/style/camera.css">
	</head>
	<body>
		<div class="BSA 재제조 현황">
			<div>
				<label for='grid_BSA'>구장 창고 BSA 재고 현황</label>
			</div>
			<div>
				<button onClick='구장_수량집계_year();'>Year</button>
				<button onClick='구장_수량집계_month();'>Month</button>
			</div>
			<div>
				<input type="date" id="_검색일_from" size="40" value="0000-00-00" max="240-12-4" required>&nbsp; ~ &nbsp;
				<input type="date" id="_검색일_to" size="40" value="0000-00-00" max="240-12-4" required>&nbsp;
				<button onClick="구장_수량집계_기간조회();">조회</button>
			</div>
			<div>
				<select id="filter-field">
					<option></option>
					<option value="관리번호">관리번호</option>
					<option value="재제조번호">재제조번호</option>
					<option value="입고일">입고일</option>
					<option value="입고처">입고처</option>
					<option value="RO번호">RO번호</option>
					<option value="부품번호">부품번호</option>
					<option value="생산연도">생산연도</option>
					<option value="ROM_ID">ROM ID</option>
					<option value="보관위치">보관위치</option>
					<option value="출고일">출고일</option>
					<option value="출고처">출고처</option>
					<option value="비고">비고</option>
				</select>

				<select id="filter-type">
					<option value="=">=</option>
					<option value="<"><</option>
					<option value="<="><=</option>
					<option value=">">></option>
					<option value=">=">>=</option>
					<option value="!=">!=</option>
					<option value="like">like</option>
				</select>

				<input id="filter-value" type="text" placeholder="value to filter">

				<button id="filter-clear">Clear Filter</button>
			</div>
			<div>
				<div id='grid_BSA'></div>
			</div>
			<div>
				<label>선택 관리번호 : </label>
				<label id='select_bsa'></label>
			</div>
			<div>
				<button onClick='delete_구장재고_bsa();'>삭제</button>
				<button onClick='창고_export_excel();'>Export to Excel</button>
			</div>
			<br/>
			<div>
				<label for='grid_품번_수량집계'>구장 창고 품번별 재고 현황</label>
			</div>
			<div>
				<div id='grid_품번_수량집계'></div>
			</div>
			<br/>
			<div>
				<label for='grid_입고처_수량집계'>구장 창고 입고처별 재고 현황</label>
			</div>
			<div>
				<div id='grid_입고처_수량집계'></div>
			</div>
			<br/>
			<div>
				<label for='grid_출고처_수량집계'>구장 창고 출고처별 재고 현황</label>
			</div>
			<div>
				<div id='grid_출고처_수량집계'></div>
			</div>
