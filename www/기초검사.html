<html>
	<head>

						</tr>

							</td>
						</tr>
						<tr>

							<td>
								<input type="text" id="_육안검사_내부_특이사항" size="100" required>

									<button onClick='_기초검사_add_DTC_Code();'>Add DTC Code(+)</button>

							<td>

						<tr>
							<td>
								<label for="_통신검사_셀전압편차"><b>통신검사 셀전압 편차(mV)</b></label>

								<input type="datetime-local" id="_공정완료일" value="0000-00-00T00:00" required>

						</tr>
						<tr>
							<td>
