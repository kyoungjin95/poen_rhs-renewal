<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배터리팩 정보입력 - 기초검사</title>
  </head>

  <body>
    <section class="page page-기초검사">
      <header class="page-header">
        <h2 class="page-title">기초검사</h2>
      </header>

      <!-- 검색 & 리스트 -->
      <div class="card">
        <h2 class="card-title">목록 조회</h2>
        <div class="gather-filter">
          <select id="filter-field">
            <option></option>
            <option value="관리번호">관리번호</option>
            <option value="재제조번호">재제조번호</option>
            <option value="구분">구분</option>
            <option value="차종">차종</option>
            <option value="품번">품번</option>
            <option value="RO_no">RO_no</option>
            <option value="공정단계">공정단계</option>
            <option value="적재No">적재No</option>
            <option value="입고">입고</option>
            <option value="제조투입">제조투입</option>
            <option value="세척투입일">세척투입일</option>
            <option value="세척">세척</option>
            <option value="기초검사투입">기초검사투입</option>
            <option value="기초검사">기초검사</option>
            <option value="분해조립투입">분해조립투입</option>
            <option value="분해조립">분해조립</option>
            <option value="성능검사투입">성능검사투입</option>
            <option value="성능검사">성능검사</option>
            <option value="EOL투입일">EOL투입일</option>
            <option value="EOL">EOL</option>
            <option value="출하검사">출하검사</option>
            <option value="납품처">납품처</option>
            <option value="출하">출하</option>
            <option value="소재지">소재지</option>
            <option value="반품입고">반품입고</option>
            <option value="재출하">재출하</option>
            <option value="완전분해">완전분해</option>
            <option value="폐기">폐기</option>
            <option value="마지막충전일">마지막충전일</option>
          </select>

          <select id="filter-type">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value="<="><=</option>
            <option value=">">></option>
            <option value=">=">>=</option>
            <option value="!=">!=</option>
            <option value="like">like</option>
          </select>

          <input id="filter-value" type="text" placeholder="검색어" />

          <button id="filter-clear">필터 초기화</button>
          <button onClick="기초검사_list();" class="btn-primary">LIST</button>
        </div>
        <div id="grid_list"></div>
      </div>

      <!-- 기본 정보 -->
      <div class="card">
        <h2 class="card-title">기본 정보</h2>
        <div class="form-grid">
          <div class="field">
            <label for="_management_id">관리번호</label>
            <div class="field-input">
              <input type="text" id="_management_id" value="" required />
              <button onClick="기초검사_시작(0);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_재제조번호">재제조번호</label>
            <div class="field-input">
              <input type="text" id="_재제조번호" value="" required />
              <button onClick="기초검사_시작(1);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_RO_no">RO no.</label>
            <div class="field-input">
              <input type="text" id="_RO_no" value="" required />
              <button onClick="기초검사_시작(2);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_구분">구분</label>
            <input type="text" id="_구분" readonly required />
          </div>
          <div class="field">
            <label for="_차종">차종</label>
            <input type="text" id="_차종" readonly required />
          </div>
          <div class="field">
            <label for="_품번">품번</label>
            <input type="text" id="_품번" readonly required />
          </div>
          <div class="field">
            <label for="_공정입고일">공정 입고일</label>
            <input type="datetime-local" id="_공정입고일" value="0000-00-00T00:00" required />
          </div>
          <div class="field">
            <label for="_VIN">VIN</label>
            <input type="text" id="_VIN" required />
          </div>
          <div class="field">
            <label for="_주행거리">주행거리</label>
            <input type="text" id="_주행거리" required />
          </div>
          <div class="field">
            <label for="_차량번호">차량 번호</label>
            <input type="text" id="_차량번호" required />
          </div>
          <div class="field full">
            <label for="_QRCode">QR</label>
            <div class="field-input">
              <input type="text" id="_QRCode" required />
            </div>
            <div class="image-grid" style="margin-top: 8px">
              <div class="image-slot"><img id="_img1" /></div>
            </div>
          </div>
        </div>
      </div>

      <!-- 검사 항목 -->
      <div class="card">
        <h2 class="card-title">검사 항목</h2>

        <div id="_육안검사_내부_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_육안검사_내부">육안검사 내부</label>
              <div class="field-input">
                <input type="text" id="_육안검사_내부" required />
                <select name="language" onchange="_육안검사내부_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
              </div>
            </div>
          </div>
          <div id="_육안검사_내부_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">전체사진</span><img id="_img2" /></div>
            <div class="image-slot"><span class="image-label">BMU</span><img id="_img3" /></div>
            <div class="image-slot"><span class="image-label">CMU</span><img id="_img4" /></div>
            <div class="image-slot"><span class="image-label">PRA</span><img id="_img5" /></div>
          </div>
        </div>

        <div id="_육안검사_내부_특이사항_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_육안검사_내부_특이사항">육안검사 내부 특이사항</label>
              <input type="text" id="_육안검사_내부_특이사항" />
            </div>
          </div>
          <div id="_육안검사_내부_특이사항_img" class="image-grid">
            <div class="image-slot"><img id="_img6" /></div>
            <div class="image-slot"><img id="_img7" /></div>
            <div class="image-slot"><img id="_img8" /></div>
            <div class="image-slot"><img id="_img9" /></div>
          </div>
        </div>

        <div id="_기밀검사_냉각유로_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_기밀검사_냉각유로">기밀검사 냉각유로</label>
              <div class="field-input">
                <input type="text" id="_기밀검사_냉각유로" required />
                <select name="language" onchange="_기밀검사_냉각유로_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
              </div>
            </div>
          </div>
          <div id="_기밀검사_냉각유로_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">측정 전체</span><img id="_img10" /></div>
            <div class="image-slot"><span class="image-label">측정값 확대</span><img id="_img11" /></div>
          </div>
        </div>

        <div id="_기밀검사_냉각유로_특이사항_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_기밀검사_냉각유로_특이사항">기밀검사 냉각유로 특이사항</label>
              <input type="text" id="_기밀검사_냉각유로_특이사항" />
            </div>
          </div>
        </div>

        <div id="_절연검사P_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_절연검사P">절연 검사 B(+)(MΩ)</label>
              <div class="field-input">
                <input type="text" id="_절연검사P판정" required placeholder="판정" />
                <select name="language" onchange="_절연검사P_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
                <input type="text" id="_절연검사P" required placeholder="값(MΩ)" />
              </div>
            </div>
          </div>
          <div id="_절연검사P_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">장비세팅 전체</span><img id="_img13" /></div>
            <div class="image-slot"><span class="image-label">측정값 확대</span><img id="_img14" /></div>
          </div>
        </div>

        <div id="_절연검사N_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_절연검사N">절연 검사 B(-)(MΩ)</label>
              <div class="field-input">
                <input type="text" id="_절연검사N판정" required placeholder="판정" />
                <select name="language" onchange="_절연검사N_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
                <input type="text" id="_절연검사N" required placeholder="값(MΩ)" />
              </div>
            </div>
          </div>
          <div id="_절연검사N_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">장비세팅 전체</span><img id="_img15" /></div>
            <div class="image-slot"><span class="image-label">측정값 확대</span><img id="_img16" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_센서데이터진단">센서데이터 진단</label>
              <div class="field-input">
                <input type="text" id="_센서데이터진단_판정" required placeholder="판정" />
                <select name="language" onchange="_센서데이터진단_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
                <input type="text" id="_센서데이터진단" required placeholder="내용" />
              </div>
            </div>
          </div>
          <div class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">고장코드-현재</span><img id="_img17" /></div>
            <div class="image-slot"><span class="image-label">고장코드-과거</span><img id="_img19" /></div>
            <div class="image-slot"><span class="image-label">센서데이터진단</span><img id="_img18" /></div>
            <div class="image-slot"><span class="image-label">PDS진단1</span><img id="_img20" /></div>
            <div class="image-slot"><span class="image-label">PDS진단2</span><img id="_img21" /></div>
          </div>
          <div id="_DTC_list" class="form-grid" style="margin-top: 12px"></div>
          <div style="margin-top: 8px">
            <button onClick="_기초검사_add_DTC_Code();" class="btn-secondary">Add DTC Code (+)</button>
          </div>
        </div>

        <!-- 불량의심부품 (분해조립 가이드) -->
        <div class="inspection-section">
          <div class="section-header">
            <h3 class="section-title">불량의심부품 — 분해조립 가이드</h3>
            <span class="section-desc">교체·폐기·자재대기 필요한 부품을 미리 표시 (차종 자동)</span>
          </div>
          <div id="_불량의심_list" class="suspicious-list"></div>
          <div style="margin-top: 8px">
            <button onClick="기초검사_불량의심_추가();" class="btn-secondary">+ 항목 추가</button>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field">
              <label for="_통신검사_팩전압">통신검사 팩전압(V)</label>
              <div class="field-input">
                <input type="text" id="_통신검사_팩전압판정" required placeholder="판정" />
                <select name="language" onchange="_기초검사_통신검사_팩전압_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
                <input type="text" id="_통신검사_팩전압" required placeholder="값(V)" />
              </div>
            </div>
            <div class="field">
              <label for="_통신검사_셀전압편차">통신검사 셀전압 편차(mV)</label>
              <div class="field-input">
                <input type="text" id="_통신검사_셀전압편차판정" required placeholder="판정" />
                <select name="language" onchange="_통신검사_셀전압_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
                <input type="text" id="_통신검사_셀전압편차" required placeholder="값(mV)" />
              </div>
            </div>
            <div class="field">
              <label for="_통신검사_최대내부저항">통신검사 최대 내부 저항(mOhm)</label>
              <div class="field-input">
                <input type="text" id="_통신검사_최대내부저항판정" required placeholder="판정" />
                <select name="language" onchange="_통신검사_최대내부저항_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
                <input type="text" id="_통신검사_최대내부저항" required placeholder="값(mOhm)" />
              </div>
            </div>
            <div class="field">
              <label for="_통신검사_최대내부저항_셀번호">최대 내부 저항 셀 번호</label>
              <div class="field-input">
                <input type="text" id="_통신검사_최대내부저항_셀번호" required placeholder="셀 번호" />
              </div>
            </div>
            <div class="field full">
              <label for="_통신검사_릴레이구동">통신검사 릴레이 구동 판정</label>
              <div class="field-input">
                <input type="text" id="_통신검사_릴레이구동" required />
                <select name="language" onchange="_통신검사_릴레이구동_콤보박스(this);">
                  <option value="">---</option>
                  <option value="통신불가">통신불가</option>
                  <option value="OK">OK</option>
                  <option value="NG">NG</option>
                </select>
                <input type="text" id="_통신검사_릴레이구동사유" required placeholder="사유" />
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 진단 정보 -->
      <div class="card">
        <h2 class="card-title">진단 정보</h2>
        <div class="form-grid">
          <div class="field">
            <label for="_BSA생산일자">배터리팩 생산일자</label>
            <input type="datetime-local" id="_BSA생산일자" value="0000-00-00T00:00" required />
          </div>
          <div class="field">
            <label for="_BSA판매일자">배터리팩 판매일</label>
            <input type="datetime-local" id="_BSA판매일자" value="0000-00-00T00:00" required />
          </div>
          <div class="field">
            <label for="_BSA수리일자">배터리팩 수리일</label>
            <input type="datetime-local" id="_BSA수리일자" value="0000-00-00T00:00" required />
          </div>
          <div class="field">
            <label for="_BMA_ROM_ID">배터리모듈 ROM ID</label>
            <input type="text" id="_BMA_ROM_ID" required />
          </div>
          <div class="field">
            <label for="_공정완료일">공정 완료일</label>
            <input type="datetime-local" id="_공정완료일" value="0000-00-00T00:00" required />
          </div>
          <div class="field">
            <label for="_검사자">검사자</label>
            <input type="text" id="_검사자" required />
          </div>
          <div class="field full">
            <label for="_분석결과">분석결과</label>
            <textarea id="_분석결과" rows="5" placeholder="1. 기초검사를 통해 찾아낸 현상과 필드현상 또는 A/S센터 진단의 원인과 분석 내용을 기재.&#10;2. 고장 원인부품 및 원인 추정 탈거 부품 기재.&#10;3. 원인 확인 불가 시 “NTF” 기재"></textarea>
          </div>
          <div class="field">
            <label for="_비고">비고</label>
            <input type="text" id="_비고" required />
          </div>
          <div class="field">
            <label for="_필드현상">필드 현상</label>
            <input type="text" id="_필드현상" required />
          </div>
          <div class="field">
            <label for="_센터진단내용">센터 진단내용</label>
            <input type="text" id="_센터진단내용" required />
          </div>
          <div class="field">
            <label for="_AS센터조치">센터 조치내용</label>
            <input type="text" id="_AS센터조치" required />
          </div>
        </div>
      </div>

      <!-- 액션 -->
      <div class="form-actions">
        <button onClick="이전페이지();" class="btn-secondary">이전 페이지</button>
        <button onclick="기초보고서_load();" class="btn-secondary">기초보고서</button>
        <button onClick="기초검사_save();" class="btn-primary">저장</button>
      </div>

      <div class="loding-bar">
        <span>Save..</span>
        <progress id="progress" value="0" max="100"></progress>
      </div>
    </section>

    <script>
      const _management_id = document.getElementById('_management_id');
      const _재제조번호 = document.getElementById('_재제조번호');
      const _RO_no = document.getElementById('_RO_no');
      const _구분 = document.getElementById('_구분');
      const _차종 = document.getElementById('_차종');
      const _품번 = document.getElementById('_품번');
      const _VIN = document.getElementById('_VIN');
      const _QRCode = document.getElementById('_QRCode');
      const _주행거리 = document.getElementById('_주행거리');
      const _차량번호 = document.getElementById('_차량번호');
      const _공정입고일 = document.getElementById('_공정입고일');
      const _육안검사_내부 = document.getElementById('_육안검사_내부');

        img.onclick = function () {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.onchange = function (e) {
            if (e.target.files && e.target.files.length > 0) {
              resize_pic(e.target.files[0], img);
            }
          };
          input.click();
        };
        img.ondblclick = function () {
          img.src = '';
        };
        img.ondragover = function (evt) {
          evt.preventDefault();
        };
        img.ondrop = function (evt) {
          evt.preventDefault();
          var files = evt.dataTransfer && evt.dataTransfer.files;
          if (files && files.length > 0) {
            resize_pic(files[0], img);
          }
        };
