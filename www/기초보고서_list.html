<html>
  <head>
    <title>기초보고서 list</title>
    <meta charset="UTF-8" />
  </head>

  <body>
    <section class="page report-list-page">
      <!-- ===== 1) 리스트 화면 ===== -->
      <div id="_보고서_리스트_화면">
        <header class="page-header">
          <h2 class="page-title">기초보고서</h2>
          <p class="page-subtitle">관리번호 또는 차종으로 검색</p>
        </header>

        <div class="card">
          <div class="report-list-search">
            <input id="filter-value" type="text" placeholder="관리번호 / 차종으로 검색하세요" autocomplete="off" />
            <button id="filter-clear" type="button">초기화</button>
            <span class="report-list-count">총 <span id="report-list-total">0</span>건</span>
          </div>
          <div id="grid_기초검사"></div>
        </div>
      </div>

      <!-- ===== 2) 보고서 상세 화면 (row 클릭 후 표시) — 처음엔 숨김 ===== -->
      <div id="_보고서_상세_화면" style="display: none">
        <button class="btn btn-back" type="button" onclick="기초보고서_list_리스트로()"><i class="fa-solid fa-arrow-left"></i> 리스트로</button>
        <header class="page-header report-detail-header">
          <h2 class="page-title">기초보고서 — <span id="_보고서_상세_관리번호"></span></h2>
        </header>
        <div id="_보고서_상세_영역"></div>
      </div>
    </section>

    <script>
      // 페이지 진입 시 flag 설정 → main.js 폴링이 기초보고서_list_시작() 호출
      flag_기초보고서_list = true;
    </script>
  </body>
</html>
