<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>배터리팩 정보입력 - EOL</title>
  </head>

  <body>
    <section class="page page-EOL">
      <header class="page-header">
        <h2 class="page-title">EOL</h2>
      </header>

      <!-- 검색 & 리스트 -->
      <div class="card">
        <h2 class="card-title">목록 조회</h2>
        <div class="gather-filter">
          <select id="filter-field">
            <option></option>
            <option value="관리번호">관리번호</option>
            <option value="재제조번호">재제조번호</option>
            <option value="구분">구분</option>
            <option value="차종">차종</option>
            <option value="품번">품번</option>
            <option value="RO_no">RO_no</option>
            <option value="공정단계">공정단계</option>
            <option value="적재No">적재No</option>
            <option value="입고">입고</option>
            <option value="제조투입">제조투입</option>
            <option value="세척투입일">세척투입일</option>
            <option value="세척">세척</option>
            <option value="기초검사투입">기초검사투입</option>
            <option value="기초검사">기초검사</option>
            <option value="분해조립투입">분해조립투입</option>
            <option value="분해조립">분해조립</option>
            <option value="성능검사투입">성능검사투입</option>
            <option value="성능검사">성능검사</option>
            <option value="EOL투입일">EOL투입일</option>
            <option value="EOL">EOL</option>
            <option value="출하검사">출하검사</option>
            <option value="납품처">납품처</option>
            <option value="출하">출하</option>
          </select>
          <select id="filter-type">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value="<="><=</option>
            <option value=">">></option>
            <option value=">=">>=</option>
            <option value="!=">!=</option>
            <option value="like">like</option>
          </select>
          <input id="filter-value" type="text" placeholder="검색어" />
          <button id="filter-clear">필터 초기화</button>
          <button onClick="EOL_list();" class="btn-primary">LIST</button>
        </div>
        <div id="grid_list"></div>
      </div>

      <!-- 기본 정보 -->
      <div class="card">
        <h2 class="card-title">기본 정보</h2>
        <div class="form-grid">
          <div class="field">
            <label for="_management_id">관리번호</label>
            <div class="field-input">
              <input type="text" id="_management_id" value="" style="text-transform: uppercase" required />
              <button onClick="EOL_시작(0);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_재제조번호">재제조번호</label>
            <div class="field-input">
              <input type="text" id="_재제조번호" required />
              <button onClick="EOL_시작(1);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_RO_no">RO no.</label>
            <div class="field-input">
              <input type="text" id="_RO_no" required />
              <button onClick="EOL_시작(2);">조회</button>
            </div>
          </div>
          <div class="field">
            <label for="_구분">구분</label>
            <input type="text" id="_구분" readonly required />
          </div>
          <div class="field">
            <label for="_차종">차종</label>
            <input type="text" id="_차종" readonly required />
          </div>
          <div class="field">
            <label for="_품번">품번</label>
            <input type="text" id="_품번" readonly required />
          </div>
          <div class="field">
            <label for="_QR기본">QR</label>
            <input type="text" id="_QR기본" required />
          </div>
          <div class="field">
            <label for="_공정입고일">공정 입고일</label>
            <input type="datetime-local" id="_공정입고일" value="0000-00-00T00:00" required />
          </div>
        </div>
      </div>

      <!-- 검사 항목 -->
      <div class="card">
        <h2 class="card-title">검사 항목</h2>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_UPR_C조립">UPR/C 조립</label>
              <div class="field-input">
                <input type="text" id="_UPR_C조립" required />
                <select onchange="_UPR_C조립_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
              </div>
            </div>
            <div class="field full">
              <label id="_UPR_C조립_label" for="_UPR_C조립_특이사항">UPR/C 조립 특이사항</label>
              <input type="text" id="_UPR_C조립_특이사항" />
            </div>
          </div>
        </div>

        <div id="_육안검사_외부_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_육안검사_외부">육안검사 외부</label>
              <div class="field-input">
                <input type="text" id="_육안검사_외부" required />
                <select onchange="_육안검사외부_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
              </div>
            </div>
          </div>
          <div id="_육안검사_외부_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">top</span><img id="_img1" /></div>
            <div class="image-slot"><span class="image-label">front</span><img id="_img2" /></div>
            <div class="image-slot"><span class="image-label">left</span><img id="_img3" /></div>
            <div class="image-slot"><span class="image-label">bottom</span><img id="_img4" /></div>
            <div class="image-slot"><span class="image-label">rear</span><img id="_img5" /></div>
            <div class="image-slot"><span class="image-label">right</span><img id="_img6" /></div>
          </div>
        </div>

        <div id="_육안검사_내부_box" class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_육안검사_내부">육안검사 내부</label>
              <div class="field-input">
                <input type="text" id="_육안검사_내부" required />
                <select onchange="_육안검사내부_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
              </div>
            </div>
          </div>
          <div id="_육안검사_내부_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">전체사진</span><img id="_img7" /></div>
            <div class="image-slot"><span class="image-label">BMU</span><img id="_img8" /></div>
            <div class="image-slot"><span class="image-label">CMU</span><img id="_img9" /></div>
            <div class="image-slot"><span class="image-label">PRA</span><img id="_img10" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_기밀검사_케이스">기밀검사 케이스</label>
              <div class="field-input">
                <input type="text" id="_기밀검사_케이스" required />
                <select onchange="_기밀검사_케이스_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
                <input type="text" id="_기밀검사_케이스_값" required placeholder="값" />
              </div>
            </div>
          </div>
          <div id="_기밀검사_케이스_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">전체</span><img id="_img11" /></div>
            <div class="image-slot"><span class="image-label">확대</span><img id="_img12" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_기밀검사_냉각유로">기밀검사 냉각유로</label>
              <div class="field-input">
                <input type="text" id="_기밀검사_냉각유로" required />
                <select onchange="_기밀검사_냉각유로_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
                <input type="text" id="_기밀검사_냉각유로_값" required placeholder="값" />
              </div>
            </div>
          </div>
          <div id="_기밀검사_냉각유로_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">전체</span><img id="_img13" /></div>
            <div class="image-slot"><span class="image-label">확대</span><img id="_img14" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_절연검사P">절연 검사 +(MΩ) <span style="color: var(--text-muted); font-size: 11px">(40MΩ 이상)</span></label>
              <div class="field-input">
                <input type="text" id="_절연검사P" required />
                <select onchange="_절연검사p_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
                <input type="text" id="_절연검사P_값" required placeholder="값" />
              </div>
            </div>
          </div>
          <div id="_절연검사P_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">전체</span><img id="_img15" /></div>
            <div class="image-slot"><span class="image-label">확대</span><img id="_img16" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_절연검사M">절연 검사 -(MΩ) <span style="color: var(--text-muted); font-size: 11px">(15MΩ 이상)</span></label>
              <div class="field-input">
                <input type="text" id="_절연검사M" required />
                <select onchange="_절연검사M_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
                <input type="text" id="_절연검사M_값" required placeholder="값" />
              </div>
            </div>
          </div>
          <div id="_절연검사M_img" class="image-grid">
            <div class="image-slot"><img id="_img17" /></div>
            <div class="image-slot"><img id="_img18" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_절연저항HVP">절연저항 HV+</label>
              <div class="field-input">
                <input type="text" id="_절연저항HVP" required />
                <select onchange="_절연저항HVP_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
                <input type="text" id="_절연저항HVP_값" required placeholder="값" />
              </div>
            </div>
          </div>
          <div class="image-grid">
            <div class="image-slot"><img id="_img19" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_절연저항HVN">절연저항 HV-</label>
              <div class="field-input">
                <input type="text" id="_절연저항HVN" required />
                <select onchange="_절연저항HVN_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
                <input type="text" id="_절연저항HVN_값" required placeholder="값" />
              </div>
            </div>
          </div>
          <div class="image-grid">
            <div class="image-slot"><img id="_img20" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_고장코드진단">고장코드 진단</label>
            </div>
          </div>
          <div class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">고장코드(현재)</span><img id="_img21" /></div>
            <div class="image-slot"><span class="image-label">고장코드(과거)</span><img id="_img22" /></div>
            <div class="image-slot"><span class="image-label">센서데이터</span><img id="_img23" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_고장코드유무">고장코드 유무</label>
              <div class="field-input">
                <input type="text" id="_고장코드유무" required />
                <select onchange="_고장코드유무_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_통신검사_팩전압">통신검사 팩전압(V)</label>
              <div class="field-input">
                <input type="text" id="_통신검사_팩전압" required />
                <select onchange="_통신검사_팩전압_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
                <input type="text" id="_통신검사_팩전압_값" required placeholder="값" />
              </div>
            </div>
          </div>
          <div id="_통신검사_팩전압_img" class="image-grid image-grid-labeled">
            <div class="image-slot"><span class="image-label">EOL 항목</span><img id="_img24" /></div>
            <div class="image-slot"><span class="image-label">CELL 전압</span><img id="_img25" /></div>
          </div>
        </div>

        <div class="inspection-section">
          <div class="form-grid">
            <div class="field full">
              <label for="_통신검사_셀전압편차">통신검사 셀전압 편차(mV)</label>
              <div class="field-input">
                <input type="text" id="_통신검사_셀전압편차" required />
                <select onchange="_통신검사_셀전압편차_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
                <input type="text" id="_통신검사_셀전압편차_값" required placeholder="값" />
              </div>
            </div>
            <div class="field">
              <label for="_셀전압MAX">셀전압 MAX</label>
              <input type="text" id="_셀전압MAX" required />
            </div>
            <div class="field">
              <label for="_셀전압MIN">셀전압 MIN</label>
              <input type="text" id="_셀전압MIN" required />
            </div>
            <div class="field full">
              <label for="_통신검사_릴레이구동">통신검사 릴레이 구동</label>
              <div class="field-input">
                <input type="text" id="_통신검사_릴레이구동" required />
                <select onchange="_통신검사_릴레이구동_콤보박스(this);">
                  <option value="">---</option>
                  <option value="통신불가">통신불가</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
              </div>
            </div>
            <div class="field full">
              <label for="_EOL항목검사">EOL 항목 검사 <span style="color: var(--text-muted); font-size: 11px">(팩 전압, 릴레이 구동 여부 통합)</span></label>
              <div class="field-input">
                <input type="text" id="_EOL항목검사" required />
                <select onchange="_EOL항목검사_콤보박스(this);">
                  <option value="">---</option>
                  <option value="OK">OK</option>
                  <option value="미실시">미실시</option>
                </select>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 완료 정보 -->
      <div class="card">
        <h2 class="card-title">완료 정보</h2>
        <div class="form-grid">
          <div class="field">
            <label for="_공정완료일">완료일</label>
            <input type="datetime-local" id="_공정완료일" value="0000-00-00T00:00" required />
          </div>
          <div class="field">
            <label for="_검사자">검사자</label>
            <input type="text" id="_검사자" required />
          </div>
          <div class="field">
            <label for="_QR">출하코드(QR)</label>
            <input type="text" id="_QR" required />
          </div>
          <div class="field">
            <label for="_용량평가값">용량평가 값</label>
            <input type="text" id="_용량평가값" required />
          </div>
          <div class="field">
            <label for="_커버류">커버류</label>
            <div class="field-input">
              <input type="text" id="_커버류" required />
              <select onchange="_커버류_콤보박스(this);">
                <option value="">---</option>
                <option value="장착확인">장착확인</option>
                <option value="미확인">미확인</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_브라켓">브라켓</label>
            <div class="field-input">
              <input type="text" id="_브라켓" required />
              <select onchange="_브라켓_콤보박스(this);">
                <option value="">---</option>
                <option value="장착확인">장착확인</option>
                <option value="미확인">미확인</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_ICUU">ICUU</label>
            <div class="field-input">
              <input type="text" id="_ICUU" required />
              <select onchange="_ICUU_콤보박스(this);">
                <option value="">---</option>
                <option value="장착확인">장착확인</option>
                <option value="미확인">미확인</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="_교체부품명">교체 부품명</label>
            <input type="text" id="_교체부품명" required />
          </div>
          <div class="field full">
            <label for="_공정흐름_이슈">공정 흐름간 이슈</label>
            <input type="text" id="_공정흐름_이슈" required />
          </div>
          <div class="field full">
            <label for="_비고">비고</label>
            <input type="text" id="_비고" required />
          </div>
        </div>
      </div>

      <!-- 액션 -->
      <div class="form-actions">
        <button onClick="EOL_DTC_count = 0; 이전페이지();" class="btn-secondary">이전 페이지</button>
        <button onClick="" class="btn-secondary">분해조립 재의뢰</button>
        <button onClick="flag_완료보고서 = true; loadPage('base/완료보고서.html');" class="btn-secondary">완료보고서</button>

          input.type = 'file';
          input.accept = 'image/*';
          input.onchange = function (e) {
            if (e.target.files && e.target.files.length > 0) {
              resize_pic(e.target.files[0], img);
            }
          };
          input.click();
        };
        img.ondblclick = function () {
          img.src = '';
        };
        img.ondragover = function (evt) {
          evt.preventDefault();
        };
        img.ondrop = function (evt) {
          evt.preventDefault();
