<html>
	<head>
		<title>신품 정보</title>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="base/style/item-detail.css">
		<link rel="stylesheet" href="base/style/tabulator.css">
	</head>
	<body>
		<div class="신품정보">
			<div>
				<center>
					<label><h2><b>신품 정보 등록</b></h2></label>
				</center>
			</div>
			<div>
				<center>
					<table border="2">
						<tr>
							<td>
								<label for="바코드"><b>바코드</b></label>
							</td>
							<td>
								<input type="text" id="_바코드" value="" size="30" required>
								<button onClick="신품정보등록_조회();">조 회</button>
							</td>
						</tr>
						<tr>
						</tr>
						<tr>
							<td>
								<label for="_품명"><b>품명</b></label>
							</td>
							<td>
								<input type="text" id="_품명" size="30" required>
								<select name="language" onchange="_품명_콤보박스(this);">
									<option value="">---</option>
									<option value="BMU">BMU</option>
									<option value="CMU">CMU</option>
									<option value="PRA">PRA</option>
									<option value="SPA">SPA</option>
									<option value="LWR Case">LWR Case</option>
									<option value="UPR Case">UPR Case</option>
									<option value="PBE">PBE</option>
									<option value="Gasket">Gasket</option>
									<option value="FuseBox">FuseBox</option>
									<option value="LV W_H">LV W_H</option>
									<option value="HV W_H">HV W_H</option>
									<option value="HV CNTR">HV CNTR</option>
									<option value="Heating CNTR">Heating CNTR</option>
									<option value="Relay">Relay</option>
									<option value="ETC">ETC</option>
									<option value="온도센서">온도센서</option>
									<option value="Busbars">Busbars</option>
									<option value="BMA">BMA</option>
								</select>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_QR"><b>QR</b></label>
							</td>
							<td>
								<input type="text" id="_QR" size="30" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_구입처"><b>구입처</b></label>
							</td>
							<td>
								<input type="text" id="_구입처" size="30" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_금액"><b>금액</b></label>
							</td>
							<td>
								<input type="text" id="_금액" size="30" required>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_사용여부"><b>사용여부</b></label>
							</td>
							<td>
								<input type="text" id="_사용여부" size="30" required>
								<select name="language" onchange="_사용여부_콤보박스(this);">
									<option value="">---</option>
									<option value="사용">사용</option>
								</select>
							</td>
						</tr>
						<tr>
							<td>
								<label for="_사용_관리번호"><b>사용 관리번호</b></label>
							</td>
							<td>
								<input type="text" id="_사용_관리번호" size="30" required>
							</td>
						</tr>
					</table>
				</center>
			</div>
			<div class="input-group">
				<center>
					<button onClick="신품정보_save();">SAVE</button>
				</center>
			</div>
		        <div>
                                <center>
                                        <label for='grid_신품정보'><b>신품 정보</b></label>
                                        <div id='grid_신품정보'>
                                        </div>
                                </center>
                        </div>
			<script>
				const _바코드 = document.getElementById('_바코드');
				const _품명 = document.getElementById('_품명');
				const _QR = document.getElementById('_QR');
				const _구입처 = document.getElementById('_구입처');
				const _금액 = document.getElementById('_금액');
				const _사용여부 = document.getElementById('_사용여부');
				const _사용_관리번호 = document.getElementById('_사용_관리번호');
			</script>
	</body>
</html>
